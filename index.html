function monthHtml(){
  const today = todayStr();
  if(!mCur){ const p = parseDate(today); mCur = { y:p.y, m:p.m }; }
  const mm = pad2(mCur.m);
  const first = `${mCur.y}-${mm}-01`;
  const lead = (parseDate(first).wd + 6) % 7;
  const dim = new Date(mCur.y, mCur.m, 0).getDate();
  const total = Math.ceil((lead + dim) / 7) * 7;
  const list = applyFilters(events, true).filter(e=>!e.isCancelled);
  const inMonth = d => d.slice(0,7) === `${mCur.y}-${mm}`;
  if(!selDay || !inMonth(selDay)) selDay = inMonth(today) ? today : first;
  let cells = '';
  for(let i=0;i<total;i++){
    const dn = i - lead + 1;
    if(dn < 1 || dn > dim){ cells += `<div class="mcell empty"></div>`; continue; }
    const d = `${mCur.y}-${mm}-${pad2(dn)}`;
    const evs = eventsOn(d, list);
    const singles = evs.filter(e=>!(e.isPeriod && e.endDate));
    const per = evs.find(e=>e.isPeriod && e.endDate);
    const col = i % 7;
    const cls = ['mcell', singles.length?'has':'', bdOn(d).length?'bd':'', d===today?'today':'', d===selDay?'sel':'', d<today?'past':'', per?'per':'', (per && d===per.date)?'ps':'', (per && d===per.endDate)?'pe':''].filter(Boolean).join(' ');
    const dots = singles.slice(0,3).map(e=>`<i style="background:${(CATEGORIES[e.category]||CATEGORIES.hennops).hex}"></i>`).join('');
    cells += `<button class="${cls}" data-act="mday" data-d="${d}" aria-label="${dn} ${AF_MAANDE[mCur.m-1]}${singles.length?', '+singles.length+' event(s)':''}"><span class="n">${dn}</span><span class="dots">${singles.length>1?dots:''}</span></button>`;
  }
  const dayEvs = applyFilters(events, true).filter(e => e.date === selDay || (e.isPeriod && e.endDate && e.date <= selDay && selDay <= e.endDate)).sort((a,b)=> sortKey(a).localeCompare(sortKey(b)));
  const sp = parseDate(selDay);
  return `<div class="mv-top"><div class="mv-name">${AF_MAANDE_KORT[mCur.m-1].toUpperCase()}</div>
      <div class="mv-meta"><div class="mv-year">${mCur.y}</div><div class="mv-full">${AF_MAANDE[mCur.m-1]}</div>
      </div></div>
    <div class="mv-nav" style="margin:0 0 10px;justify-content:space-between"><button data-act="mnav" data-d="-1" aria-label="Vorige maand">‹</button><button data-act="mtoday" style="flex:1">Vandag</button><button data-act="mnav" data-d="1" aria-label="Volgende maand">›</button></div>
    <div class="mgrid">${['Ma','Di','Wo','Do','Vr','Sa','So'].map(h=>`<div class="mh">${h}</div>`).join('')}${cells}</div>
    <div class="day-head">${AF_DAE[sp.wd]} ${sp.d} ${AF_MAANDE[sp.m-1]}</div>
    <div id="dayList">${bdOn(selDay).map(b=>`<div class="bd-row">🎂 ${bdLabel(b)} verjaar</div>`).join('')}${dayEvs.length ? dayEvs.map(e=>cardHtml(e, today)).join('') : `${bdOn(selDay).length ? '' : '<div class="empty-state" style="padding:22px 10px"><p>Niks op hierdie dag nie.</p></div>'}`}</div>`;
}

// ---------- WEEK-PLAKKAAT ----------
function weekMonday(){
  const t = todayStr();
  return addDaysToDateStr(t, -((parseDate(t).wd + 6) % 7) + 7 * weekOffset);
}
function weekData(){
  const mon = weekMonday();
  const list = applyFilters(events, true).filter(e=>!e.isCancelled);
  const days = [];
  for(let i=0;i<7;i++){
    const d = addDaysToDateStr(mon, i);
    days.push({ d, bd: bdOn(d), evs: eventsOn(d, list).filter(e=>!(e.isPeriod && e.endDate)).sort((a,b)=> sortKey(a).localeCompare(sortKey(b))) });
  }
  const sun = addDaysToDateStr(mon,6);
  const periods = list.filter(e=>e.isPeriod && e.endDate && e.date <= sun && e.endDate >= mon).sort((a,b)=>a.date.localeCompare(b.date));
  return { mon, sun, days, periods };
}
function weekTitle(){
  return weekOffset === 0 ? 'Hierdie week' : weekOffset === 1 ? 'Volgende week' : weekOffset === -1 ? 'Verlede week' : 'Week';
}
function weekHtml(){
  const today = todayStr();
  const w = weekData();
  const bands = w.days.map((day,i)=>{
    const p = parseDate(day.d);
    const bdLine = day.bd.length ? `<div>🎂 ${day.bd.map(b=>escapeHtml(b.name)).join(', ')}</div>` : '';
    const evs = (day.evs.length || day.bd.length) ? bdLine + day.evs.map(e=>{
      const t = e.time || '';
      const em = emojiOf(e);
      return `<div>${t ? `<span class="t">${escapeHtml(t)}</span>` : ''}${escapeHtml(e.title)}${em ? ' '+em : ''}</div>`;
    }).join('') : `<div>Niks</div>`;
    return `<div class="wband ${(day.evs.length||day.bd.length) ? (i%2?'b2':'b1') : 'bz'} ${day.d===today?'today':''}"><div class="dc"><div class="dn">${p.d}</div><div class="dw">${AF_DAE_KORT[p.wd].toUpperCase()}</div></div><div class="evs">${evs}</div></div>`;
  }).join('');
  return `<div class="wk-top"><div><h2>${weekTitle()}</h2><div class="wk-sub">${formatShortDate(w.mon)} – ${formatShortDate(w.sun)}</div></div></div>
    <div class="mv-nav" style="margin:0 0 10px;justify-content:space-between"><button data-act="wnav" data-d="-1" aria-label="Vorige week">‹</button><button data-act="wtoday" style="flex:1">Vandag</button><button data-act="wnav" data-d="1" aria-label="Volgende week">›</button></div>
    ${w.periods.length ? `<div class="wk-strips">${w.periods.map(e=>`<div class="wk-strip">📅 ${escapeHtml(e.title)} <span>${formatShortDate(e.date)} – ${formatShortDate(e.endDate)}</span></div>`).join('')}</div>` : ''}
    ${bands}
    ${unlocked ? `<div class="row-acts"><button class="ics-btn" data-act="weekimg" style="background:var(--accent);border-color:var(--accent);color:#fff">🖼 HK: deel as prent</button></div>` : ''}`;
}
function canvasFit(ctx, text, maxW){
  if(ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while(t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0,-1);
  return t.trimEnd() + '…';
}
async function makeWeekPoster(){
  const w = weekData();
  try{ if(document.fonts && document.fonts.load){ await document.fonts.load('900 60px Archivo'); await document.fonts.load('700 30px Archivo'); } }catch(e){}
  const W = 1080, H = 1350;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const FF = "Archivo, 'Work Sans', Arial, sans-serif";
  x.fillStyle = '#CBC3BA'; x.fillRect(0,0,W,H);
  const logo = document.querySelector('.brand img');
  if(logo && logo.complete && logo.naturalWidth) x.drawImage(logo, 56, 46, 123, 102);
  x.fillStyle = '#33291F'; x.textBaseline = 'alphabetic';
  x.font = `900 82px ${FF}`; x.fillText(weekTitle().toUpperCase(), 206, 108);
  x.font = `600 34px ${FF}`; x.fillStyle = '#6E6459';
  x.fillText(`${formatShortDate(w.mon)} – ${formatShortDate(w.sun)}  ·  Huis Hennops`, 208, 152);
  const per = w.periods.slice(0,3);
  per.forEach((e,i)=>{
    const y = 176 + i*50;
    x.fillStyle = 'rgba(168,110,83,0.28)'; x.beginPath(); x.roundRect ? x.roundRect(40, y, W-80, 40, 20) : x.rect(40, y, W-80, 40); x.fill();
    x.fillStyle = '#33291F'; x.font = `700 24px ${FF}`; x.textAlign = 'left';
    x.fillText(canvasFit(x, `${e.title}   ${formatShortDate(e.date)} – ${formatShortDate(e.endDate)}`, W-130), 64, y + 28);
  });
  const top = 190 + per.length*50, bandH = Math.floor((H - 131 - top) / 7), gap = 0;
  w.days.forEach((day,i)=>{
    const y = top + i*bandH;
    const has = day.evs.length > 0 || day.bd.length > 0;
    x.fillStyle = has ? (i%2 ? '#6F4331' : '#9A5D42') : '#B7ACA0';
    x.fillRect(0, y, W, bandH - gap);
    const fg = has ? '#F6F3EE' : '#4A4036';
    x.fillStyle = fg;
    const p = parseDate(day.d);
    const k = bandH / 147;
    x.font = `900 ${Math.round(104*k)}px ${FF}`; x.textAlign = 'center';
    x.fillText(String(p.d), 100, y + Math.round(104*k));
    x.font = `700 ${Math.round(24*k)}px ${FF}`; x.fillText(AF_DAE_KORT[p.wd].toUpperCase(), 100, y + Math.round(134*k));
    x.textAlign = 'left';
    const lines = [];
    if(!has) lines.push('Niks');
    else { if(day.bd.length) lines.push('🎂 ' + day.bd.map(b=>b.name).join(', ')); day.evs.forEach(e=>{
      const t = e.time || '';
      const em = emojiOf(e);
      lines.push((t ? t + '   ' : '') + e.title + (em ? '  ' + em : ''));
    }); }
    const shown = lines.length > 3 ? lines.slice(0,2).concat([`+ ${lines.length-2} meer`]) : lines;
    x.font = `700 32px ${FF}`;
    const lh = Math.min(40, Math.floor((bandH - 20) / Math.max(1, shown.length)));
    const y0 = y + (bandH - lh*shown.length)/2 + lh*0.72;
    shown.forEach((ln,j)=>{ x.fillText(canvasFit(x, ln, W - 210 - 50), 200, y0 + j*lh); });
  });
  x.fillStyle = '#33291F'; x.fillRect(0, H-131, W, 131);
  x.fillStyle = '#F6F3EE'; x.font = `800 34px ${FF}`; x.fillText('Huis Hennops kalender', 56, H-72);
  x.font = `500 26px ${FF}`; x.fillStyle = '#CBC3BA';
  x.fillText(canvasFit(x, location.href.split('#')[0].split('?')[0].replace(/^https?:\/\//,''), W-112), 56, H-30);
  return await new Promise(res => c.toBlob(res, 'image/png'));
}
async function shareWeekImage(){
  const w = weekData();
  if(!w.days.some(d=>d.evs.length) && !w.periods.length){ showToast('Niks op hierdie week se kalender nie'); return; }
  showToast('Maak die prent reg...');
  let blob;
  try{ blob = await makeWeekPoster(); }catch(e){ showToast('Kon nie die prent maak nie'); return; }
  if(!blob){ showToast('Kon nie die prent maak nie'); return; }
  const file = new File([blob], 'hennops-week.png', { type:'image/png' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:'Hierdie week by Hennops' }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  triggerDownload(blob, 'hennops-week.png');
  showToast('Prent afgelaai. Stuur dit in die groep.');
}

// ---------- MEDEDELINGSBORD ----------
const BCATS = { besigheid:'Besigheid', diens:'Dienste en hulp', koop:'Te koop', belangrik:'Belangrik' };
const DAY30 = 30*24*60*60*1000;
function myPosts(){ try{ return JSON.parse(lsGet('hennops-myposts') || '[]'); }catch(e){ return []; } }
function addMyPost(id){ const a = myPosts(); a.push(id); lsSet('hennops-myposts', JSON.stringify(a.slice(-30))); }
function pendingPosts(){ return Object.values(bord || {}).filter(p=>p && p.status === 'wag').sort((a,b)=>a.at-b.at); }
function activePosts(){
  const n = Date.now();
  return Object.values(bord || {}).filter(p=>p && p.status === 'oop' && p.exp > n)
    .sort((a,b)=> ((b.cat==='belangrik')-(a.cat==='belangrik')) || (b.at - a.at));
}
function normPhone(s){
  let d = String(s||'').replace(/[^\d+]/g,'').replace(/^\+/,'');
  if(!d) return '';
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('0')) d = '27' + d.slice(1);
  return /^\d{9,15}$/.test(d) ? d : null;
}
function postHtml(p, mode){
  const mine = myPosts().includes(p.id);
  const wa = p.phone ? `https://wa.me/${p.phone}?text=${encodeURIComponent('Hi, ek het jou plasing "'+p.title+'" op die Hennops-mededelingsbord gesien.')}` : '';
  return `<article class="post ${p.cat==='belangrik'?'imp':''}">
    <div class="post-top"><span class="post-cat">${escapeHtml(BCATS[p.cat]||'')}</span><span>${mode==='wag' ? 'Wag vir goedkeuring' : 'Verval '+formatShortDate(dateOfMs(p.exp))}</span></div>
    <h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.text)}</p>
    <div class="post-foot"><span>${p.name ? 'deur '+escapeHtml(p.name) : ''}</span>${(wa && mode!=='wag') ? `<a class="wa" href="${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}</div>
    <div class="row-btns" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      ${(unlocked && mode==='wag') ? `<button class="mini-btn" style="background:var(--sage);color:#fff;border-color:var(--sage)" data-act="bapprove" data-id="${escapeHtml(p.id)}">Keur goed</button><button class="mini-btn danger" data-act="breject" data-id="${escapeHtml(p.id)}">Wys af</button>` : ''}
      ${(mode!=='wag' && unlocked) ? `<button class="mini-btn" data-act="brenew" data-id="${escapeHtml(p.id)}">Hernu 30 dae</button><button class="mini-btn danger" data-act="bdel" data-id="${escapeHtml(p.id)}">Verwyder</button>` : ''}
      ${(mode==='wag' && mine && !unlocked) ? `<button class="mini-btn danger" data-act="bdel" data-id="${escapeHtml(p.id)}">Trek terug</button>` : ''}
    </div>
  </article>`;
}
function bordHtml(){
  if(!me) return `<div class="empty-state"><div class="big">📌</div><p>Die mededelingsbord is vir lede.</p><p><button class="btn btn-primary" data-act="signin" style="margin-top:12px">Teken in of skep 'n profiel</button></p></div>`;
  const act = activePosts();
  const pend = pendingPosts();
  const mineIds = myPosts();
  const myPend = pend.filter(p=>mineIds.includes(p.id));
  let html = `<p class="bord-intro">Besighede, dienste en belangrike aankondigings van manne van die huis. Die HK keur alles goed voor dit wys, en plasings verval ná 30 dae. Wil jy joune verwyder of hernu? Vra die HK.</p>
    <button class="ics-btn" data-act="bnew" style="width:100%;background:var(--accent);border-color:var(--accent);color:#fff;margin-bottom:6px">+ Plaas iets</button>`;
  if(unlocked && pend.length){
    html += `<div class="sec-h">Wag vir goedkeuring (${pend.length})</div>` + pend.map(p=>postHtml(p,'wag')).join('');
  } else if(myPend.length){
    html += `<div class="sec-h">Jou plasings wat wag</div>` + myPend.map(p=>postHtml(p,'wag')).join('');
  }
  html += `<div class="sec-h">Op die bord</div>`;
  html += act.length ? act.map(p=>postHtml(p,'oop')).join('') : `<div class="empty-state"><div class="big">📌</div><p>Nog niks op die bord nie.</p><p>Wees die eerste een en plaas iets.</p></div>`;
  return html;
}

async function savePost(){
  const err = document.getElementById('pbErr');
  const cat = document.getElementById('pb-cat').value;
  const title = document.getElementById('pb-title').value.trim();
  const text = document.getElementById('pb-text').value.trim();
  const name = document.getElementById('pb-name').value.trim();
  const ph = normPhone(document.getElementById('pb-phone').value);
  if(!title || !text){ err.textContent = 'Die titel en beskrywing is nodig.'; return; }
  if(ph === null){ err.textContent = 'Daai nommer lyk nie reg nie. Gee \'n volle nommer, of los dit leeg.'; return; }
  const still = myPosts().filter(id => bord[id]).length;
  if(!unlocked && still >= 3){ err.textContent = 'Jy het reeds 3 plasings op die bord. Verwyder eers een.'; return; }
  if(name) lsSet('hennops-name', name);
  const id = 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  const auto = unlocked;
  const post = { id, cat, title, text, name, phone: ph || '', at: Date.now(), status: auto ? 'oop' : 'wag', exp: auto ? Date.now() + DAY30 : 0 };
  try{
    await set(ref(db,'bord/'+id), post);
    bord[id] = post;
    addMyPost(id);
    closeModal();
    render();
    showToast(auto ? 'Geplaas' : 'Ontvang. Dit wys sodra die HK dit goedkeur.');
  }catch(e){ err.textContent = 'Kon nie stoor nie: ' + e.message; }
}

// ---------- VERJAARSDAE ----------
let verjaar = {};
const AF_MON_NAMES = ['januarie','februarie','maart','april','mei','junie','julie','augustus','september','oktober','november','desember'];
const isLeap = (y)=> (y%4===0 && y%100!==0) || y%400===0;
function bdList(){ return Object.values(verjaar || {}).filter(b=>b && b.name && b.m && b.d); }
function bdLabel(b){ return escapeHtml(b.name) + (b.type === 'alumnus' ? ` <span style="color:var(--ink-soft);font-weight:500">(alumnus${b.yr ? " '"+String(b.yr).slice(-2) : ''})</span>` : ''); }
function bdPlain(b){ return b.name + (b.type === 'alumnus' ? ` (alumnus${b.yr ? " '"+String(b.yr).slice(-2) : ''})` : ''); }
function bdOn(dateStr){
  const p = parseDate(dateStr);
  return bdList().filter(b => (b.m === p.m && b.d === p.d) || (b.m === 2 && b.d === 29 && p.m === 2 && p.d === 28 && !isLeap(p.y)));
}
function bdSoon(n){
  const out = [];
  const t = todayStr();
  for(let i=1;i<=n;i++){ const d = addDaysToDateStr(t, i); bdOn(d).forEach(b=>out.push({ b, d })); }
  return out;
}
function bdCardHtml(){
  const today = bdOn(todayStr());
  const soon = bdSoon(7);
  if(!today.length && !soon.length) return '';
  const head = today.length ? `<div class="big">🎂 Vandag verjaar ${today.map(bdLabel).join(', ')}!</div>` : `<div class="big">🎂 Verjaarsdae</div>`;
  const sl = soon.length ? `<div class="soon">Binnekort: ${soon.slice(0,5).map(x=>`${bdLabel(x.b)} (${formatShortDate(x.d)})`).join(' · ')}${soon.length>5?` · +${soon.length-5} meer`:''}</div>` : '';
  const sh = (unlocked && (today.length || soon.length)) ? `<button class="share" data-act="bdshare">↗ HK: deel op WhatsApp</button>` : '';
  return `<div class="bday">${head}${sl}${sh}</div>`;
}

function parseBdDate(txt){

  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(txt); if(m) return { m:+m[2], d:+m[3] };
  m = /^(\d{1,2})[\s\/\-\.]+([a-zë]+|\d{1,2})/.exec(txt);
  if(!m) return null;
  let d = +m[1], mon = m[2];
  let mi = /^\d+$/.test(mon) ? +mon : AF_MON_NAMES.findIndex(x=>x === mon || x.startsWith(mon) && mon.length>=3) + 1;

}

function toMin(t){ if(!t) return null; const [h,m] = t.split(':').map(Number); return h*60+(m||0); }
function conflictText(data){
  const out = [];
  const a0 = toMin(data.time), a1 = a0 == null ? null : (toMin(data.endTime) ?? a0 + 60);
  const lo = (data.location||'').trim().toLowerCase();
  const dEnd = data.isPeriod && data.endDate ? data.endDate : data.date;
  events.forEach(e=>{
    if(e.id === data.id || e.isCancelled) return;
    const eEnd = e.isPeriod && e.endDate ? e.endDate : e.date;
    if(e.date > dEnd || eEnd < data.date) return;
    if(e.isPeriod && e.endDate && e.category === 'akademies' && data.category !== 'akademies'){ out.push(`Hierdie datum val binne "${e.title}" (${formatShortDate(e.date)} – ${formatShortDate(e.endDate)}).`); return; }
    const el = (e.location||'').trim().toLowerCase();
    if(!lo || !el || lo !== el || data.isPeriod || e.isPeriod) return;
    const b0 = toMin(e.time), b1 = b0 == null ? null : (toMin(e.endTime) ?? b0 + 60);
    const overlap = (a0 == null || b0 == null) ? true : (a0 < b1 && b0 < a1);
    if(overlap) out.push(`"${e.title}" gebruik ook ${e.location} op ${formatShortDate(e.date)}${e.time ? ' om '+e.time : ''}.`);
  });
  return out;
}

  if(c.includes('email-already-in-use')) return 'Hierdie e-pos het reeds \'n rekening. Teken eerder in.';
  if(c.includes('weak-password')) return 'Kies \'n wagwoord van minstens 6 karakters.';
  if(c.includes('too-many-requests')) return 'Te veel pogings. Wag \'n paar minute en probeer weer.';
  if(c.includes('network')) return 'Geen internet nie. Probeer weer.';

function onbVal(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function onbCollect(){

    d.naam = onbVal('o-naam'); d.van = onbVal('o-van'); d.tel = onbVal('o-tel'); d.studie = onbVal('o-studie');

function onbValidate(){
  const st = W.step, d = W.d;
  if(st === 1){
    if(!d.naam || !d.van) return 'Tik jou naam en van in.';
    const p = normPhone(d.tel); if(!p) return 'Tik \'n geldige selfoonnommer in.'; d.tel = p;
    if(!d.studie) return 'Sê wat jy swot.';
    if((d.vd && !d.vm) || (!d.vd && d.vm)) return 'Vul die dag én die maand van jou verjaarsdag in, of los albei leeg.';
    if(d.vd && d.vm && d.vd > new Date(2024, d.vm, 0).getDate()) return `${AF_MAANDE[d.vm-1]} het nie ${d.vd} dae nie.`;
  } else if(st === 2){
    const k = W.n.k1;
    if(!k.naam || !k.tel) return 'Vul die nood-kontak se naam en selfoon in.';
    const p = normPhone(k.tel); if(!p) return 'Die nood-kontak se nommer lyk nie reg nie.'; k.tel = p;
    if(W.showK2){ const k2 = W.n.k2;
      if(k2.naam || k2.tel){ if(!k2.naam || !normPhone(k2.tel)) return 'Vul die tweede kontak se naam en \'n geldige nommer in, of haal hom af.'; k2.tel = normPhone(k2.tel); }

  }
  return '';

async function onbNext(){

    renderOnb(); return;
  }
  onbCollect();
  const bad = onbValidate();
  if(bad){ W.err = bad; renderOnb(); return; }
  W.err = '';
  if(W.step < (W.edit ? 2 : 3)){ W.step++; renderOnb(); return; }
  await saveProfile();
}
async function saveProfile(){
  const d = W.d, uid = me.uid, yr = new Date().getFullYear(), old = myProfile || {};
  const prof = { naam:d.naam, van:d.van, tel:d.tel, studie:d.studie, jaar:d.jaar||JARE[0], vd:d.vd||0, vm:d.vm||0, wys:!!d.wys, kamer:d.kamer||'', status:old.status||'lid', bevestig:yr, at:old.at||Date.now(), consent:{ at:Date.now(), v:1 } };
  const nood = { k1: W.n.k1 };
  if(W.showK2 && W.n.k2 && W.n.k2.naam) nood.k2 = W.n.k2;
  const upd = {};
  upd['profiles/'+uid] = prof;
  upd['nood/'+uid] = nood;
  upd['medies/'+uid] = Object.assign({}, W.m, { at: Date.now() });
  upd['verjaar/'+uid] = (prof.wys && prof.vd && prof.vm) ? { id:uid, name:fullName(prof), d:prof.vd, m:prof.vm, type:prof.status==='alumnus'?'alumnus':'lid', yr:'' } : null;
  const wasEdit = W.edit;
  W.busy = true; renderOnb();
  try{
    await update(ref(db), upd);
    myProfile = prof;
    closeOnb(); render();
    showToast(wasEdit ? 'Profiel bygewerk' : 'Welkom by Hennops, ' + prof.naam + '!');

async function openKontrole(uid, back){

      const held = past.filter(e=>all[e.id] && Object.keys(all[e.id]).length);
      K.held = held.length; K.att = held.filter(e=>all[e.id][uid]);
      try{ const vs = (await get(ref(db,'verskoon'))).val() || {}; K.pc = pctCalc(past, uid, e=>!!(all[e.id] && all[e.id][uid]), e=>!!(vs[e.id] && vs[e.id][uid])); }catch(_){ K.pc = pctCalc(past, uid, e=>!!(all[e.id] && all[e.id][uid]), ()=>false); }
      K.list = held.slice(-8).reverse().map(e=>({ t:e.title, d:e.date, ok:!!all[e.id][uid] }));
    } else {

      K.held = null; K.att = cand.filter((e,i)=>rs[i]);
      try{ const vp2 = past.filter(e=>e.verpl); const r1 = await Promise.all(vp2.map(e=>get(ref(db,'opkoms/'+e.id+'/'+uid)).then(x=>x.exists()).catch(()=>false))); const r2 = await Promise.all(vp2.map((e,i)=>r1[i] ? false : get(ref(db,'verskoon/'+e.id+'/'+uid)).then(x=>x.exists()).catch(()=>false))); const ix = id=>vp2.findIndex(e=>e.id === id); K.pc = pctCalc(past, uid, e=>r1[ix(e.id)] === true, e=>r2[ix(e.id)] === true); }catch(_){ K.pc = null; }

function pctCalc(past, uid, okF, exF){
  const vp = past.filter(e=>e.verpl && !e.isPeriod); let ok = 0, ex = 0;

  const base = vp.length - ex;
  return { ok, ex, base, tot: vp.length, pct: base > 0 ? Math.round(100 * ok / base) : null };
}

  const p = K.p || {}, g = K.g || {};

}

  const rows = [
    [opPct === null ? 'n' : opPct >= 70 ? 'g' : opPct >= 40 ? 'y' : 'r', 'Opkoms', pc ? (pc.ok + ' van ' + pc.base + ' verpligte events' + (pc.ex ? ' · ' + pc.ex + ' verskoon' : '')) : (attPct === null ? attN + ' aangeteken' : attN + ' van ' + K.held + ' events'), opPct],

function nlLynNaTekst(){
  const arr = Object.values(nl || {}).sort((a,b)=>String(a.naam).localeCompare(String(b.naam)));
  return arr.map(m=>m.naam + ' | ' + (m.t === 'ou' ? 'Oupoot' : m.t === 'groot' ? 'Grootpoot' : 'Kleinpoot') + (m.r ? ' | ' + ROL_TXT[m.r] : '')).join('\n');
}
function nlParse(txt){
  const rows = [], errs = [], seen = {};
  const pmap = { oupoot:'ou', ou:'ou', grootpoot:'groot', groot:'groot', kleinpoot:'klein', klein:'klein' }, rmap = { hk:'hk', prim:'prim', geelbek:'geelbek' };
  txt.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
    const pt = l.split('|').map(x=>x.trim()), L = 'Reël ' + (i+1) + ': ';
    if(pt.length < 2 || !pt[0]){ errs.push(L + 'gebruik Naam | Poot | Rol'); return; }
    let t = '', r = '', bad = '';
    pt.slice(1).forEach(x=>{
      if(!x) return; const k = nlKey(x);
      if(pmap[k]){ if(t) bad = 'twee pote'; t = pmap[k]; }
      else if(rmap[k]){ if(r) bad = 'twee rolle'; r = rmap[k]; }
      else bad = 'onbekend "' + x + '" (Poot: Kleinpoot, Grootpoot of Oupoot. Rol: HK, Prim of Geelbek)';
    });
    if(bad){ errs.push(L + pt[0] + ': ' + bad); return; }
    if(r === 'geelbek'){ if(!t) t = 'groot'; if(t !== 'groot'){ errs.push(L + pt[0] + ': \'n Geelbek is altyd \'n Groot Poot'); return; } }
    else if(r === 'hk' || r === 'prim'){
      if(!t){ errs.push(L + pt[0] + ': gee sy poot (Grootpoot of Oupoot), bv. ' + pt[0] + ' | Oupoot | ' + ROL_TXT[r]); return; }
      if(t === 'klein'){ errs.push(L + pt[0] + ': ' + ROL_TXT[r] + ' kan nie \'n Klein Poot wees nie'); return; }
    } else if(!t){ errs.push(L + pt[0] + ': gee \'n poot (Kleinpoot, Grootpoot of Oupoot)'); return; }
    const key = nlKey(pt[0]); if(!key){ errs.push(L + 'geen naam nie'); return; }
    if(seen[key]){ errs.push(L + '"' + pt[0] + '" kom twee keer voor'); return; }
    seen[key] = 1; rows.push({ key, naam: pt[0].slice(0,80), t, r });
  });
  return { rows, errs };
}

function resizeImg(file, max, square, limit){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = ()=>{
      let sw = im.width, sh = im.height, sx = 0, sy = 0, w, h;
      if(square){ const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; w = h = Math.min(max, s); }
      else { const k = Math.min(1, max / Math.max(sw, sh)); w = Math.round(sw * k); h = Math.round(sh * k); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = .8, out = c.toDataURL('image/jpeg', q);
      while(out.length > limit && q > .3){ q -= .1; out = c.toDataURL('image/jpeg', q); }

const QRCH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function rndCode(){ let s = ''; const a = crypto.getRandomValues(new Uint8Array(4)); a.forEach(x=>{ s += QRCH[x % QRCH.length]; }); return s; }

function qrUrl(eid, code){ return location.href.split('#')[0].split('?')[0] + '#opk=' + eid + '~' + code; }
function qrSvg(text){

  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) p += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 2*m} ${n + 2*m}" shape-rendering="crispEdges" role="img" aria-label="QR-kode vir opkoms"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#2B231B"/></svg>`;
}

// ----- Verjaarsdag-popup met konfetti -----
function confetti(host){
  if(REDUCED) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; host.appendChild(c);
  const ctx = c.getContext('2d'); const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W2 = c.width = innerWidth * dpr, H2 = c.height = innerHeight * dpr;
  const cols = ['#9A5D42', '#758378', '#E3B04B', '#F6F3EE', '#CBC3BA', '#8F5A43'];
  const ps = Array.from({ length: 130 }, ()=>({ x: Math.random() * W2, y: -Math.random() * H2 * .6, w: (6 + Math.random() * 8) * dpr, h: (10 + Math.random() * 10) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .25, vy: (2 + Math.random() * 3.5) * dpr, vx: (Math.random() - .5) * 2 * dpr, c: cols[(Math.random() * cols.length) | 0] }));
  let f = 0;
  (function tick(){
    if(!c.isConnected) return;
    ctx.clearRect(0, 0, W2, H2); f++;
    ps.forEach(p=>{ p.x += p.vx + Math.sin((f + p.r * 40) / 30) * .6 * dpr; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if(f < 330) requestAnimationFrame(tick); else c.remove();
  })();
}
function showBdPopup(list){

function wrapTxt(s, n, max){
  const words = String(s || '').split(/\s+/).filter(Boolean), out = []; let cur = '';
  words.forEach(w=>{ if((cur + ' ' + w).trim().length > n){ if(cur) out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if(cur) out.push(cur); return out.slice(0, max);
}

  const upd = { ['gedagtes/' + id]: rec };
  if(!anon) upd['mygedagtes/' + me.uid + '/' + id] = { soort, teks: teks.slice(0, 80), status: 'ontvang', at };
  try{ await update(ref(db), upd); ping('gedagte'); closeModal(); showToast(anon ? 'Anoniem gestuur. Dankie!' : 'Gestuur. Dankie!'); }
  catch(e){ err.textContent = 'Kon nie stuur nie: ' + e.message; }
}
function openGedHK(){
  if(!unlocked){ showToast('Net die HK sien dit.'); return; }
  const ord = { ontvang: 0, besig: 1, opgelos: 2 };
  const list = Object.entries(allGed || {}).map(([id, g])=>({ id, ...g })).sort((a,b)=>(ord[a.status] - ord[b.status]) || (b.at - a.at)).slice(0, 40);
  modalBody.innerHTML = `<h3>💬 Gedagtes</h3>` + (list.length ? list.map(g=>{ const d = new Date(g.at || 0); return `<div class="card-lite">
      <div style="display:flex;justify-content:space-between;gap:8px"><b>${escapeHtml(g.soort || 'Gedagte')}</b><small class="st">${GED_ST[g.status] || ''}</small></div>
      <div class="hint" style="margin:2px 0 6px">${g.name ? escapeHtml(g.name) : 'Anoniem'} · ${d.getDate()} ${AF_MAANDE_KORT[d.getMonth()]}</div>
      <div style="font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(g.teks || '')}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${Object.keys(GED_ST).filter(s=>s !== g.status).map(s=>`<button class="mini-btn" data-act="gedstat" data-id="${escapeHtml(g.id)}" data-s="${s}">${GED_ST[s]}</button>`).join('')}${g.status === 'opgelos' ? `<button class="mini-btn danger" data-act="geddel" data-id="${escapeHtml(g.id)}">Verwyder</button>` : ''}</div></div>`; }).join('') : `<p class="hint">Nog niks nie.</p>`) +
    `<div class="modal-actions"><button class="btn btn-secondary" data-act="mclose">Sluit</button></div>`;
  openModal();
}
async function gedStat(id, s){
  const g = allGed[id]; if(!g) return;
  const upd = { ['gedagtes/' + id + '/status']: s };
  if(g.uid) upd['mygedagtes/' + g.uid + '/' + id + '/status'] = s;
  try{ await update(ref(db), upd); g.status = s; openGedHK(); liveR(); }catch(e){ showToast('Kon nie: ' + e.message); }
}
async function gedDel(id){
  const g = allGed[id]; if(!g) return;
  const upd = { ['gedagtes/' + id]: null }; if(g.uid) upd['mygedagtes/' + g.uid + '/' + id] = null;
  try{ await update(ref(db), upd); delete allGed[id]; openGedHK(); liveR(); }catch(e){ showToast('Kon nie: ' + e.message); }
}

// ----- Eie eksamenrooster (net die lid self) -----
function openRstModal(){
  const t = todayStr(), list = rosterList();
  modalBody.innerHTML = `<h3>📚 My eksamenrooster</h3>
    <p class="hint" style="margin:-8px 0 12px">Net jy sien dit. Tik jou vakke en datums in vanaf jou eie rooster.</p>
    ${list.length ? list.map(x=>{ const n = daysBetween(t, x.datum), past = n < 0; return `<div class="hrow" style="${past ? 'opacity:.5' : ''}"><div class="t"><b>${escapeHtml(x.vak)}</b><small>${formatDateLabel(x.datum)}${x.tyd ? ' · ' + escapeHtml(x.tyd) : ''}${x.plek ? ' · ' + escapeHtml(x.plek) : ''}</small></div><div style="text-align:right"><b style="font-family:Archivo,sans-serif;font-size:22px;color:var(--accent-dark)">${past ? '✓' : n === 0 ? 'Vandag' : n}</b>${!past && n > 0 ? `<small style="display:block">${n === 1 ? 'dag' : 'dae'}</small>` : ''}</div><button class="mini-btn danger" data-act="rstdel" data-id="${x.id}" aria-label="Verwyder">✕</button></div>`; }).join('') : `<p class="hint">Nog geen vakke nie.</p>`}
    <div class="sec-h">Voeg 'n vak by</div>
    <div class="field"><label for="rVak">Vak</label><input id="rVak" maxlength="60" placeholder="bv. Ekonomie 101"></div>
    <div class="row2" style="display:flex;gap:10px"><div class="field" style="flex:1;min-width:0"><label for="rDat">Datum</label><input type="date" id="rDat"></div><div class="field" style="flex:1;min-width:0"><label for="rTyd">Tyd</label><input type="time" id="rTyd"></div></div>
    <div class="field"><label for="rPlek">Saal (opsioneel)</label><input id="rPlek" maxlength="40"></div>
    <div id="rErr" class="error-msg"></div>
    <div class="modal-actions"><button class="btn btn-secondary" data-act="mclose">Sluit</button><button class="btn btn-primary" data-act="rstadd">Voeg by</button></div>`;
  openModal();
}
async function addRst(){
  const g = id=>document.getElementById(id).value.trim(), err = document.getElementById('rErr');
  const x = { vak: g('rVak'), datum: g('rDat'), tyd: g('rTyd'), plek: g('rPlek') };
  if(!x.vak){ err.textContent = 'Tik die vak se naam in.'; return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(x.datum)){ err.textContent = 'Kies die datum.'; return; }
  const id = newId('r_');
  try{ await set(ref(db, 'rooster/' + me.uid + '/' + id), x); myRooster[id] = x; openRstModal(); liveR(); }
  catch(e){ err.textContent = 'Kon nie stoor nie: ' + e.message; }
}
async function delRst(id){
  try{ await remove(ref(db, 'rooster/' + me.uid + '/' + id)); delete myRooster[id]; openRstModal(); liveR(); }
  catch(e){ showToast('Kon nie: ' + e.message); }
}

// ---------- START ----------
initApp();
</script>
<script>
/* toeganklikheid: dialoog-rol, fokus-val, Escape en fokus terug */
(function(){
  var ov=document.getElementById('modalOverlay')||document.getElementById('ov');if(!ov)return;
  var box=ov.querySelector('.modal');var prev=null;
  box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('tabindex','-1');
  function foc(){return Array.prototype.slice.call(box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])')).filter(function(e){return e.offsetParent!==null;});}
  function labelIt(){var h=box.querySelector('h2,h3');if(h){if(!h.id)h.id='dlgTitle';box.setAttribute('aria-labelledby',h.id);}else box.removeAttribute('aria-labelledby');}
  new MutationObserver(function(){
    var open=ov.classList.contains('open');
    if(open&&!box.__open){box.__open=true;prev=document.activeElement;labelIt();
      if(!ov.classList.contains('see'))setTimeout(function(){var f=foc();(f[0]||box).focus({preventScroll:true});},60);}
    else if(!open&&box.__open){box.__open=false;if(prev&&prev.focus&&document.contains(prev))try{prev.focus({preventScroll:true});}catch(e){}prev=null;}
    else if(open)labelIt();
  }).observe(ov,{attributes:true,attributeFilter:['class']});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open')||ov.classList.contains('see'))return;
    if(e.key==='Escape'){e.preventDefault();ov.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
    if(e.key!=='Tab')return;var f=foc();if(!f.length){e.preventDefault();box.focus();return;}
    var a=document.activeElement,i=f.indexOf(a);
    if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus();}
    else if(!e.shiftKey&&(i===-1||i===f.length-1)){e.preventDefault();f[0].focus();}
  });
})();
</script>
