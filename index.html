<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Huis Hennops — Kalender</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#CBC3BA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hennops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#CBC3BA;
  --surface:#FBF9F6;
  --ink:#33291F;
  --ink-soft:#6E6459;
  --line:#B7ACA0;
  --accent:#A86E53;
  --accent-dark:#8A5640;
  --sage:#758378;
  --danger:#B84A3E;
  --radius:14px;
  --radius-sm:10px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Work Sans', system-ui, -apple-system, sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; touch-action:manipulation;}
h1,h2,h3{font-family:'Fraunces', Georgia, serif; margin:0; font-weight:600;}

.app{max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh;}

/* ---------- KOP ---------- */
.topbar{
  position:sticky; top:0; z-index:10;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.brand svg{flex-shrink:0;}
.brand h1{font-size:19px; letter-spacing:-0.01em; line-height:1.1;}
.live-badge{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); margin-top:2px;}
.live-badge .dot{width:6px; height:6px; border-radius:50%; background:#5C9E7A; flex-shrink:0;}
.hk-btn{
  flex-shrink:0; min-height:40px; padding:0 16px; border-radius:999px;
  border:1.5px solid var(--accent); background:var(--surface); color:var(--accent-dark);
  font-weight:700; font-size:13.5px; cursor:pointer;
}
.hk-btn.on{background:var(--accent); color:#fff;}

main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));}

/* ---------- BANIER ---------- */
.countdown-banner{
  background:linear-gradient(135deg, var(--accent), var(--accent-dark)); color:#fff;
  border-radius:var(--radius); padding:12px 14px; margin-bottom:12px;
  font-size:14px; font-weight:600;
}
.countdown-banner .sub{font-weight:400; opacity:0.88; font-size:12.5px; display:block; margin-top:2px;}

/* ---------- SOEK + FILTERS ---------- */
.search{position:relative; margin-bottom:10px;}
.search span{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:15px; pointer-events:none;}
.search input{
  width:100%; height:44px; padding:0 14px 0 40px; border:1px solid var(--line);
  border-radius:var(--radius-sm); background:var(--surface); color:var(--ink);
  font-family:inherit; font-size:16px;
}
.search input:focus{outline:2px solid var(--accent); outline-offset:1px;}

.chips{
  display:flex; gap:8px; overflow-x:auto; padding:2px 14px 12px; margin:0 -14px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0; height:38px; padding:0 15px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); font-size:13.5px; font-weight:500; color:var(--ink-soft);
  cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center;
}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.chip .dot{width:8px; height:8px; border-radius:50%; margin-right:7px;}

/* ---------- LYS ---------- */
.month-label{
  font-family:'Fraunces', Georgia, serif; font-size:16px; font-weight:700; color:var(--ink);
  margin:22px 2px 10px; display:flex; align-items:center; gap:10px;
}
.month-label::after{content:''; flex:1; height:1px; background:var(--line);}
#listArea > .month-label:first-child{margin-top:6px;}

.section-label{
  font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--accent-dark); margin:6px 2px 8px;
}

.day-row{display:flex; gap:10px; margin-bottom:6px;}
.day-col{width:44px; flex-shrink:0; text-align:center; padding-top:6px;}
.day-num{
  font-family:'Fraunces', Georgia, serif; font-size:21px; font-weight:700; line-height:1;
  width:38px; height:38px; margin:0 auto; display:flex; align-items:center; justify-content:center;
  border-radius:50%;
}
.day-wd{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-top:3px;}
.day-row.today .day-num{background:var(--accent); color:#fff;}
.day-row.today .day-wd{color:var(--accent-dark);}
.day-row.pastday .day-col{opacity:.55;}
.day-cards{flex:1; min-width:0;}

.event-card{
  background:var(--surface); border-radius:var(--radius); padding:12px 12px 6px 13px;
  margin-bottom:8px; border-left:4px solid var(--accent);
  display:flex; justify-content:space-between; gap:8px; align-items:flex-start;
}
.event-card.past{opacity:0.55;}
.event-main{flex:1; min-width:0;}
.event-title{font-weight:600; font-size:15.5px; line-height:1.3; margin-bottom:5px; overflow-wrap:anywhere;}
.event-meta{display:flex; flex-wrap:wrap; gap:6px;}
.meta-pill{
  display:inline-flex; align-items:center; gap:4px; padding:4px 10px 4px 8px;
  border-radius:999px; background:var(--bg); color:var(--ink-soft);
  font-size:12px; font-weight:500; max-width:100%;
}
.meta-pill.port{background:rgba(168,110,83,.15); color:var(--accent-dark); font-weight:600;}
.meta-pill.moved{background:#F3E3C8; color:#7A5410; font-weight:600;}
.today-box{background:var(--surface); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px; border:1.5px solid var(--accent);}
.today-box h2{font-size:14px; font-family:'Work Sans',sans-serif; font-weight:700; color:var(--accent-dark); margin-bottom:6px; letter-spacing:.02em;}
.tb-row{display:flex; gap:10px; align-items:baseline; padding:5px 0; border-top:1px solid var(--bg); font-size:14.5px;}
.tb-row:first-of-type{border-top:none;}
.tb-when{flex-shrink:0; width:92px; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.tb-title{flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere;}
.tb-ports{flex-shrink:0; font-size:14px;}
.chip-label{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); margin:0 2px 5px;}
.chips.ports{padding-bottom:6px;}
.chips.ports .chip{height:34px; font-size:13px;}
.chips.ports .chip.active{background:var(--accent); border-color:var(--accent);}
.port-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.port-opt{display:flex; align-items:center; gap:8px; min-height:44px; padding:0 10px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff; font-size:14px; cursor:pointer;}
.port-opt input{width:20px; height:20px; min-height:0; flex-shrink:0; padding:0;}
.event-notes{font-size:13.5px; color:var(--ink-soft); margin-top:7px; overflow-wrap:anywhere;}
.event-side{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; max-width:104px;}
.cat-tag{
  font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff;
  white-space:nowrap;
}
.card-actions{display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin-top:2px;}
.link-btn{
  background:none; border:none; color:var(--ink-soft); font-size:12.5px; cursor:pointer;
  min-height:38px; padding:0 10px 0 0;
}
.menu-btn{
  width:38px; height:38px; border-radius:50%; border:none; background:var(--bg); color:var(--ink);
  font-size:18px; line-height:1; cursor:pointer;
}
.manage{display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 8px;}
.mini-btn{
  min-height:38px; padding:0 13px; border-radius:var(--radius-sm); border:1px solid var(--line);
  background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer;
}
.mini-btn.danger{color:var(--danger); border-color:var(--danger);}

.empty-state{text-align:center; padding:44px 20px; color:var(--ink-soft);}
.empty-state .big{font-size:34px; margin-bottom:6px;}
.empty-state p{margin:4px 0 0; font-size:14px;}

.foot{margin-top:18px; display:flex; flex-direction:column; gap:10px; align-items:stretch;}
.ics-btn{
  min-height:50px; border-radius:var(--radius); border:1.5px solid var(--sage); background:transparent;
  color:var(--sage); font-weight:700; font-size:14.5px; cursor:pointer;
}
.toggle-past{
  background:none; border:none; color:var(--ink-soft); font-size:13px; min-height:40px; cursor:pointer;
  text-decoration:underline;
}

/* ---------- MODAL ---------- */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(51,41,31,0.5);
  align-items:flex-end; justify-content:center; z-index:100;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--surface); width:100%; max-width:560px; border-radius:20px 20px 0 0;
  padding:14px 18px calc(24px + env(safe-area-inset-bottom));
  max-height:92vh; max-height:92dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  animation:slideUp .22s ease-out;
}
.modal::before{content:''; display:block; width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px;}
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal h3{font-size:19px; margin-bottom:14px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; min-height:46px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
  font-family:inherit; font-size:16px; color:var(--ink); background:#fff;
}
.field textarea{resize:vertical; min-height:80px;}
.field input[type=checkbox]{width:22px; height:22px; min-height:0; padding:0; flex-shrink:0;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
.check-row{display:flex; align-items:center; gap:10px;}
.check-row label{margin:0; font-size:14px; color:var(--ink); font-weight:500;}
.modal-actions{display:flex; gap:10px; margin-top:18px;}
.btn{
  flex:1; min-height:50px; padding:0 14px; border-radius:var(--radius-sm); border:none; font-weight:600;
  font-size:15px; cursor:pointer;
}
.btn-primary{background:var(--accent); color:#fff;}
.btn-secondary{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
.error-msg{color:var(--danger); font-size:13px; margin-top:6px;}
.hint{font-size:12.5px; color:var(--ink-soft); margin-top:5px;}
.menu-list{display:flex; flex-direction:column; gap:10px;}

.notice{
  background:var(--surface); border-radius:var(--radius); padding:24px 20px; margin-top:10px;
}
.notice h3{font-size:17px; margin-bottom:8px;}
.notice p{font-size:14px; color:var(--ink-soft); margin:0 0 12px;}
.notice.bad{border:1.5px solid var(--danger);}
.notice pre{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px;
  font-size:12.5px; overflow-x:auto; margin:0 0 14px; user-select:all; -webkit-user-select:all;
}
.notice ol{padding-left:20px; margin:0 0 14px; font-size:14px; color:var(--ink-soft);}
.notice li{margin-bottom:4px;}

.toast{
  position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; max-width:92vw;
  font-size:14px; font-weight:500; z-index:200; opacity:0; pointer-events:none; transition:opacity .2s;
  text-align:center;
}
.toast.show{opacity:1;}

.back-today-btn{
  position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); right:16px; z-index:50;
  background:var(--ink); color:#fff; border:none; border-radius:999px; min-height:44px;
  padding:0 18px; font-size:14px; font-weight:600; cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,0.25); display:none;
}
.back-today-btn.show{display:block;}


.verse{margin:0 0 12px;padding:14px 16px 12px;background:var(--surface);border-radius:var(--radius);border-left:4px solid var(--sage);}
.verse blockquote{margin:0;font-family:'Fraunces',Georgia,serif;font-size:17px;line-height:1.5;font-weight:600;color:var(--ink);}
.verse figcaption{margin-top:7px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.vtabs{display:flex;gap:4px;margin:0 0 12px;background:rgba(0,0,0,.08);padding:4px;border-radius:12px;}
.vtab{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--ink-soft);cursor:pointer;position:relative;}
.vtab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);}
.vtab em{font-style:normal;background:var(--accent);color:#fff;border-radius:99px;font-size:10.5px;padding:1px 6px;margin-left:4px;}
.filterbar{display:flex;gap:8px;align-items:center;margin:0 -14px 10px;padding:0 14px;}
.filterbar .chips{margin:0;padding:2px 0 2px;flex:1;min-width:0;}
.chip.pf{border-color:var(--ink);} .chip.pf.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.fwrap{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px;}
.fwrap .chip{background:#fff;}
.fwrap .chip.active{background:var(--ink);color:#fff;}
/* maand */
.mv-top{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 2px 10px;}
.mv-name{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:104px;line-height:.8;letter-spacing:-.01em;color:var(--ink);}
.mv-meta{text-align:right;}
.mv-year{font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1;}
.mv-full{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.mv-nav{display:flex;gap:6px;margin-top:10px;justify-content:flex-end;}
.mv-nav button{min-width:44px;height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;background:var(--surface);border-radius:14px;padding:10px 6px 8px;}
.mh{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);padding-bottom:6px;}
.mcell{position:relative;height:52px;border:0;background:transparent;font-family:inherit;display:flex;flex-direction:column;align-items:center;padding-top:4px;cursor:pointer;color:var(--ink);}
.mcell .n{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-weight:700;font-size:14.5px;}
.mcell.has .n{background:var(--accent);color:#fff;}
.mcell.today .n{box-shadow:0 0 0 2px var(--ink);}
.mcell.sel{background:rgba(51,41,31,.10);border-radius:10px;}
.mcell.per{background:rgba(168,110,83,.30);}
.mcell.per.ps{border-top-left-radius:999px;border-bottom-left-radius:999px;}
.mcell.per.pe{border-top-right-radius:999px;border-bottom-right-radius:999px;}
.mcell.past .n{opacity:.5;}
.mcell.empty{pointer-events:none;}
.dots{display:flex;gap:3px;margin-top:3px;height:6px;}
.dots i{width:5px;height:5px;border-radius:50%;display:block;}
.day-head{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:700;margin:16px 2px 8px;}
/* week-plakkaat */
.wk-top{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 2px 10px;gap:8px;}
.wk-top h2{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:68px;line-height:.82;margin:0;text-transform:uppercase;}
.wk-sub{font-size:13px;color:var(--ink-soft);font-weight:600;margin-top:4px;}
.wband{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;margin-bottom:6px;color:#F6F3EE;min-height:76px;}
.wband.b1{background:#A86E53;} .wband.b2{background:#8A5640;} .wband.bz{background:rgba(51,41,31,.12);color:var(--ink-soft);}
.wband .dc{width:56px;flex-shrink:0;text-align:center;}
.wband .dn{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:56px;line-height:.9;}
.wband .dw{font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.9;margin-top:2px;}
.wband .evs{flex:1;min-width:0;font-size:14.5px;line-height:1.3;font-weight:600;}
.wband .evs div{margin:1px 0;overflow-wrap:anywhere;} .wband .evs .t{font-weight:800;margin-right:6px;}
.wband.today{box-shadow:0 0 0 3px var(--ink);}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px;}
.row-acts .ics-btn{flex:1;min-width:140px;}
/* bord */
.post{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--sage);}
.post.imp{border-left-color:var(--accent);}
.post-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-soft);}
.post-cat{font-weight:700;background:var(--bg);border-radius:99px;padding:3px 10px;color:var(--ink);}
.post h3{font-family:'Fraunces',Georgia,serif;font-size:18px;margin:8px 0 4px;overflow-wrap:anywhere;}
.post p{margin:0 0 8px;font-size:14.5px;overflow-wrap:anywhere;white-space:pre-wrap;}
.post-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;}
.wa{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:var(--sage);color:#fff;font-weight:700;font-size:13.5px;text-decoration:none;}
.bord-intro{font-size:13.5px;color:var(--ink-soft);margin:0 2px 12px;}
.sec-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);margin:16px 2px 8px;}
.link-btn.on{color:var(--accent-dark);font-weight:700;}
.event-card.flash{animation:flash 2.4s ease-out;}
@keyframes flash{0%,35%{box-shadow:0 0 0 4px var(--accent);}100%{box-shadow:0 0 0 0 transparent;}}
@media(prefers-reduced-motion: reduce){ .modal{animation:none;} .event-card.flash{animation:none;box-shadow:0 0 0 3px var(--accent);} }
/* ===== POLEER ===== */
.bday{margin:0 0 12px;padding:12px 16px;background:var(--surface);border-radius:var(--radius);border-left:4px solid var(--accent);box-shadow:var(--shadow);font-size:14.5px;line-height:1.45;}
.bday .big{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:17px;}
.bday .soon{margin-top:6px;font-size:13px;color:var(--ink-soft);}
.bday .share{margin-top:6px;min-height:36px;padding:0 12px;border:1.5px solid rgba(168,110,83,.6);border-radius:999px;background:transparent;color:var(--accent-dark);font-weight:700;font-size:12.5px;cursor:pointer;}
.mcell.bd::after{content:'🎂';position:absolute;top:-1px;right:2px;font-size:10px;line-height:1;}
.bd-row{background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:14px;border-left:4px solid var(--accent);}
.field .port-opt{display:flex;align-items:center;gap:6px;margin:0;padding:0 8px;font-weight:500;color:var(--ink);font-size:13px;white-space:nowrap;}
.field .port-opt input{width:20px;height:20px;margin:0;padding:0;flex-shrink:0;}
.field input[type=date],.field input[type=time]{min-width:0;width:100%;max-width:100%;}
.field{min-width:0;}
.card-actions{border-top:0 !important;margin-top:2px;padding-top:0;}
.section-label{margin:16px 2px 8px;}
.filterbar + .mv-top,.filterbar + .wk-top{margin-top:18px;}
.wk-strips{margin:0 0 10px;display:flex;flex-direction:column;gap:5px;}
.wk-strip{display:flex;align-items:center;gap:8px;background:rgba(168,110,83,.2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink);}
.wk-strip span{color:var(--ink-soft);font-weight:500;}
.a2hs{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:var(--radius);padding:12px 12px 12px 14px;margin-bottom:12px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.4;}
.a2hs b{display:block;font-size:14px;margin-bottom:2px;}
.a2hs .x{flex-shrink:0;width:40px;height:40px;margin:-8px -6px 0 0;border:0;background:transparent;font-size:20px;color:var(--ink-soft);cursor:pointer;border-radius:50%;}
.a2hs .go{margin-top:8px;min-height:38px;padding:0 14px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
.warn-msg{color:#8A5A12;background:#F7E8CB;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;}
.hrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(51,41,31,.08);font-size:13.5px;}
.hrow:first-of-type{border-top:0;}
.hrow .t{min-width:0;overflow-wrap:anywhere;}
.hrow small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px;}
.hrow.undone{opacity:.5;}
.wk-top h2{font-size:64px;}
.wk-top{margin-bottom:8px;}
.wband .dc{width:62px;}
.wband .dn{font-size:50px;}
.wband{gap:10px;}
.chip{height:32px;padding:0 12px;font-size:12.5px;}
:root{ --shadow:0 1px 2px rgba(51,41,31,.06),0 4px 14px rgba(51,41,31,.06); }
.topbar{background:rgba(203,195,186,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
main{padding-top:12px;}
.countdown-banner{box-shadow:var(--shadow);font-size:14.5px;letter-spacing:.005em;}
.today-box{box-shadow:var(--shadow);}
.verse{box-shadow:var(--shadow);padding:15px 18px 13px;}
.verse blockquote{font-weight:500;font-size:17.5px;}
.vtabs{background:rgba(51,41,31,.09);padding:3px;gap:2px;}
.vtab{min-height:40px;font-size:13px;border-radius:10px;}
.vtab.active{box-shadow:0 1px 4px rgba(51,41,31,.18);}
.search input{box-shadow:var(--shadow);border-color:transparent;}
/* filters: pak netjies in, geen afgesnyde chips nie */
.filterbar{display:block;margin:0 0 12px;padding:0;}
.filterbar .chips{display:flex;flex-wrap:wrap;overflow:visible;gap:6px;margin:0;padding:0;}
.chip{height:34px;padding:0 13px;font-size:13px;border-color:transparent;box-shadow:0 1px 2px rgba(51,41,31,.08);}
.chip .dot{margin-right:6px;}
.chip.pf{border:1.5px solid var(--ink);box-shadow:none;background:transparent;color:var(--ink);font-weight:600;}
.chip.pf.active{background:var(--accent);border-color:var(--accent);color:#fff;}
/* kaarte */
.event-card{box-shadow:var(--shadow);padding:13px 13px 6px 14px;margin-bottom:10px;}
.event-title{font-size:16px;font-weight:600;letter-spacing:-.005em;}
.meta-pill{background:rgba(203,195,186,.45);}
.cat-tag{font-size:10.5px;letter-spacing:.02em;}
.card-actions{border-top:1px solid rgba(51,41,31,.07);margin-top:6px;padding-top:2px;width:100%;}
.link-btn{font-weight:600;color:var(--ink-soft);}
.link-btn.on{color:var(--accent-dark);}
.month-label{font-size:18px;margin:26px 2px 12px;}
.day-num{font-size:20px;}
/* maand: een deurlopende band agter die syfers */
.mgrid{box-shadow:var(--shadow);padding:12px 8px 10px;row-gap:2px;}
.mcell{height:50px;padding-top:2px;}
.mcell.per{background:transparent;}
.mcell.per::before{content:'';position:absolute;left:0;right:0;top:3px;height:30px;background:rgba(168,110,83,.22);z-index:0;}
.mcell.per.ps::before{left:3px;border-radius:15px 0 0 15px;}
.mcell.per.pe::before{right:3px;border-radius:0 15px 15px 0;}
.mcell.per.ps.pe::before{border-radius:15px;}
.mcell.ps,.mcell.pe{border-radius:0;}
.mcell .n{position:relative;z-index:1;}
.mcell.sel{background:transparent;}
.mcell.sel .n{box-shadow:0 0 0 2px var(--ink);}
.mcell.today .n{box-shadow:0 0 0 2px var(--ink);}
.mcell.has.sel .n,.mcell.has.today .n{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--surface);}
.mv-nav button{border-width:1.5px;border-color:rgba(51,41,31,.35);}
.mv-nav button:active{background:rgba(51,41,31,.1);}
.day-head{font-size:19px;margin:18px 2px 10px;}
/* week */
.wband{box-shadow:0 1px 2px rgba(51,41,31,.1);margin-bottom:5px;}
.wband.bz{box-shadow:none;}
/* bord */
.post{box-shadow:var(--shadow);}
.post-cat{background:rgba(203,195,186,.5);}
/* knoppies onder */
.foot{margin-top:22px;gap:8px;}
.ics-btn{min-height:48px;font-size:14px;border-width:1.5px;border-color:rgba(117,131,120,.7);}
#shareWeekBtn{border-color:rgba(168,110,83,.7)!important;}
.toggle-past{color:var(--ink-soft);margin-top:4px;}
/* modal */
.modal{border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.18);}
.modal h3{font-size:20px;}
.btn{border-radius:12px;min-height:50px;}
.btn-primary{box-shadow:0 2px 8px rgba(168,110,83,.35);}
.field input,.field select,.field textarea{border-color:rgba(51,41,31,.18);border-radius:10px;}

body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--accent);opacity:.17;
  -webkit-mask:var(--contour) center/cover no-repeat;mask:var(--contour) center/cover no-repeat;}
.countdown-banner,.verse,.bday{position:relative;isolation:isolate;overflow:hidden;}
.countdown-banner::before,.verse::before,.bday::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--room);opacity:.16;
  -webkit-mask:var(--contour) center/cover no-repeat;mask:var(--contour) center/cover no-repeat;}
.verse{background:var(--groen-diep);border-left:0;color:var(--room);padding:18px 20px 16px;}
.verse blockquote{color:var(--room);font-size:19px;line-height:1.45;font-weight:600;}
.verse figcaption{color:rgba(246,243,238,.85);font-size:13px;}
.bday{background:var(--roes-diep);border-left:0;color:var(--room);padding:16px 20px;}
.bday .big{color:var(--room);font-size:19px;}
.bday .soon{color:rgba(246,243,238,.88);}
.bday .share{border-color:rgba(246,243,238,.7);color:var(--room);}
.countdown-banner{background:linear-gradient(135deg,var(--accent),var(--roes-diep));}
/* groot kondenseerde syfers en maande, soos die Maand- en Week-aansig */
.day-col{width:54px;}
.day-num{width:auto !important;height:auto !important;background:transparent !important;color:var(--ink) !important;border-radius:0 !important;
  font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:42px;line-height:.9;letter-spacing:-.01em;}
.day-row.today .day-num{color:var(--accent) !important;}
.day-wd{font-size:10.5px;letter-spacing:.06em;}
.month-label{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:52px;line-height:.85;text-transform:uppercase;letter-spacing:0;margin:30px 2px 14px;align-items:flex-end;gap:12px;}
.month-label::after{height:3px;background:var(--ink);margin-bottom:6px;opacity:.85;}
.event-card{border-radius:16px;}
/* leë skerms met die olifant */
.empty-state .big{font-size:0 !important;width:96px;height:80px;margin:0 auto 12px;background:var(--ink-soft);opacity:.4;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;}
.topbar .brand img{filter:drop-shadow(0 1px 0 rgba(255,255,255,.25));}
/* ===== PROFIEL / WIZARD ===== */
.hdr-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.hdr-actions .hk-btn{padding:0 14px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-actions #meBtn{background:var(--accent);color:#fff;border-color:var(--accent);}
.onb{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(18px + env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom));}
.onb[hidden]{display:none;}
.onb::before{content:'';position:fixed;inset:0;pointer-events:none;background:var(--accent);opacity:.17;-webkit-mask:var(--contour) center/cover no-repeat;mask:var(--contour) center/cover no-repeat;}
.onb-in{position:relative;max-width:520px;margin:0 auto;}
.onb-prog{height:6px;border-radius:3px;background:rgba(51,41,31,.15);margin:6px 0 6px;overflow:hidden;}
.onb-prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s;}
.onb h2{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:52px;line-height:.88;text-transform:uppercase;margin:12px 0 6px;}
.onb-sub{margin:0 0 4px;color:var(--ink-soft);font-size:15px;}
.onb .card{background:var(--surface);border-radius:16px;padding:16px;margin-top:12px;box-shadow:var(--shadow);}
.onb .row2{display:flex;gap:10px;} .onb .row2 .field{flex:1;min-width:0;}
.onb-actions{display:flex;gap:10px;margin-top:18px;}
.onb .hint{font-size:12.5px;color:var(--ink-soft);}
.onb select{width:100%;}
/* ===== RONDTE 2 ===== */
.evfs,.qrfs{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(14px + env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom));}
.evfs{z-index:95;background:var(--bg);} .qrfs{z-index:96;background:#F6F3EE;}
.evfs[hidden],.qrfs[hidden],.bdpop[hidden]{display:none;}
.evfs::before{content:'';position:fixed;inset:0;pointer-events:none;background:var(--accent);opacity:.14;-webkit-mask:var(--contour) center/cover no-repeat;mask:var(--contour) center/cover no-repeat;}
.evfs-in{position:relative;max-width:560px;margin:0 auto;}
.evfs-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.evfs-x{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:18px;cursor:pointer;color:var(--ink);}
.evfs-img{display:block;width:100%;max-height:320px;object-fit:cover;border-radius:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.evfs-img.ph{height:180px;background:rgba(51,41,31,.08);}
.evfs h2{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:46px;line-height:.92;text-transform:uppercase;margin:4px 0 8px;overflow-wrap:anywhere;}
.evfs-when{font-weight:700;font-size:16px;color:var(--ink);}
.evfs-cd{margin-top:8px;color:var(--accent-dark);font-size:15px;font-weight:600;}
.evfs-cd b{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:44px;line-height:1;vertical-align:-4px;margin-right:4px;}
.evfs-notes{margin-top:14px;padding:14px 16px;background:var(--surface);border-radius:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow);}
.evfs-hk{display:flex;flex-wrap:wrap;gap:8px;}
.evfs-ok{margin-top:12px;padding:12px;border-radius:12px;background:rgba(117,131,120,.2);text-align:center;font-weight:700;color:var(--groen-diep);}
.bigcd{display:flex;align-items:center;gap:16px;width:100%;margin:0 0 12px;padding:14px 20px;border:0;border-radius:var(--radius);background:var(--ink);color:#F6F3EE;text-align:left;cursor:pointer;position:relative;isolation:isolate;overflow:hidden;font:inherit;min-height:60px;}
.bigcd::before{content:'';position:absolute;inset:0;z-index:-1;background:#F6F3EE;opacity:.1;-webkit-mask:var(--contour) center/cover no-repeat;mask:var(--contour) center/cover no-repeat;}
.bigcd .n{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:84px;line-height:.82;color:#CBC3BA;flex-shrink:0;}
.bigcd .n.w{font-size:46px;}
.bigcd .t{display:flex;flex-direction:column;min-width:0;} .bigcd .t b{font-size:19px;line-height:1.2;overflow-wrap:anywhere;} .bigcd .t small{font-size:12.5px;opacity:.75;}
.opdie{margin:14px 0 0;padding:12px 16px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);}
.opdie .hrow:first-of-type{border-top:0;}
.qr-in{max-width:420px;margin:0 auto;text-align:center;}
.qr-t{font-weight:700;color:var(--accent-dark);font-size:14px;margin-top:6px;}
.qrfs h2{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:40px;line-height:.92;text-transform:uppercase;margin:6px 0 14px;overflow-wrap:anywhere;}
.qr-box{display:inline-block;background:#fff;padding:10px;border-radius:18px;box-shadow:var(--shadow);line-height:0;}
.qr-box svg{width:min(76vw,330px);height:auto;display:block;}
.qr-bar{height:5px;border-radius:3px;background:rgba(51,41,31,.12);margin:14px auto 8px;max-width:330px;overflow:hidden;}
.qr-bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;animation:qrbar linear infinite;} .qr-bar i.still{animation:none;}
@keyframes qrbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.qr-code{font-size:15px;color:var(--ink-soft);} .qr-code b{font-family:'Archivo',system-ui,sans-serif;font-size:34px;letter-spacing:.2em;color:var(--ink);margin-left:6px;}
.qr-n{margin-top:16px;font-size:16px;} .qr-n b{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:64px;line-height:1;vertical-align:-6px;margin-right:6px;}
.qr-names{min-height:20px;font-size:13px;color:var(--ink-soft);margin:6px 0 14px;overflow-wrap:anywhere;}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid rgba(51,41,31,.25);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;} .tick.on{background:var(--sage);border-color:var(--sage);}
.bdpop{position:fixed;inset:0;z-index:97;background:rgba(43,35,27,.74);display:flex;align-items:center;justify-content:center;padding:22px;}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.bdp-card{position:relative;z-index:2;background:#F6F3EE;border-radius:24px;padding:28px 22px 22px;text-align:center;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.bdp-cake{font-size:68px;line-height:1;}
.bdp-h{font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 62;font-stretch:62%;font-weight:900;font-size:clamp(26px,8vw,38px);line-height:.95;text-transform:uppercase;margin-top:10px;overflow-wrap:break-word;hyphens:none;}
.bdp-n{margin-top:12px;font-size:16px;line-height:1.5;color:var(--ink-soft);}
.mvdw{margin:0 0 12px;} .mvdw svg{display:block;width:100%;max-width:320px;margin:0 auto;border-radius:26px;box-shadow:var(--shadow);}
.mv-act{display:flex;gap:8px;justify-content:center;margin-top:10px;}
@media (prefers-reduced-motion:no-preference){

function rawPorts(e){
  const p = e && e.portfolios;
  if(!p) return [];
  return Array.isArray(p) ? p : Object.values(p);
}
function getPorts(e){ return rawPorts(e).filter(k => PORTFOLIOS[k]); }
// Ou events het Eerstejaars/Seniors as portefeulje gestoor; dit is nou 'n aparte "vir wie"-etiket.
function getAudience(e){
  if(e && AUDIENCES[e.audience]) return e.audience;
  return rawPorts(e).find(k => AUDIENCES[k]) || '';
}

const AF_MAANDE = ['Januarie','Februarie','Maart','April','Mei','Junie','Julie','Augustus','September','Oktober','November','Desember'];
const AF_MAANDE_KORT = ['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Des'];
const AF_DAE = ['Sondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrydag','Saterdag'];
const AF_DAE_KORT = ['So','Ma','Di','Wo','Do','Vr','Sa'];

// ---------- HELPERS ----------
// localStorage kan in sommige foon-blaaiers/voorskou-vensters 'n fout gooi — daarom altyd in try/catch.
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2600);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function pad2(n){ return String(n).padStart(2,'0'); }

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

function parseDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return { y, m, d, wd: new Date(y, m-1, d).getDay() };
}

function formatDateLabel(dateStr){
  const p = parseDate(dateStr);
  return `${AF_DAE[p.wd]} ${p.d} ${AF_MAANDE[p.m-1]}`;
}

function formatShortDate(dateStr){
  const p = parseDate(dateStr);
  return `${p.d} ${AF_MAANDE_KORT[p.m-1]}`;
}

function daysBetween(dateStr1, dateStr2){
  const a = parseDate(dateStr1), b = parseDate(dateStr2);
  return Math.round((Date.UTC(b.y,b.m-1,b.d) - Date.UTC(a.y,a.m-1,a.d)) / 86400000);
}

function addDaysToDateStr(dateStr, days){
  const p = parseDate(dateStr);
  const dt = new Date(p.y, p.m-1, p.d);
  dt.setDate(dt.getDate()+days);
  return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());
}

function sortKey(e){ return e.date + ((e.time) || '00:00'); }

function getNextEvent(){
  const today = todayStr();
  const active = events.filter(e=>!e.isCancelled);
  const ongoing = active.find(e=> e.isPeriod && e.endDate && e.date <= today && today <= e.endDate);
  if(ongoing) return { event: ongoing, ongoing: true };
  const upcoming = active.filter(e => e.date >= today).sort((a,b)=> sortKey(a).localeCompare(sortKey(b)));
  if(upcoming.length === 0) return null;
  return { event: upcoming[0], ongoing: false, days: daysBetween(today, upcoming[0].date) };
}

// ---------- ICS EXPORT (Outlook / Apple / Google kalender) ----------
function toICSDateOnly(dateStr){ return dateStr.split('-').join(''); }

function toICSDateTime(dateStr, timeStr){
  const t = timeStr ? timeStr.replace(':','') + '00' : '090000';
  return dateStr.split('-').join('') + 'T' + t;
}

function computeEndDateTime(dateStr, timeStr, endTimeStr){
  if(endTimeStr){
    if(endTimeStr < timeStr) return { date: addDaysToDateStr(dateStr,1), time: endTimeStr };
    return { date: dateStr, time: endTimeStr };
  }
  const p = parseDate(dateStr);
  const [h,mi] = timeStr.split(':').map(Number);
  const dt = new Date(p.y, p.m-1, p.d, h, mi);
  dt.setHours(dt.getHours()+1);
  return {
    date: dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()),
    time: pad2(dt.getHours())+':'+pad2(dt.getMinutes())
  };
}

function escapeICS(str){
  return (str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}

function buildICS(){
  const now = new Date();
  const stamp = now.getUTCFullYear()+pad2(now.getUTCMonth()+1)+pad2(now.getUTCDate())+'T'+pad2(now.getUTCHours())+pad2(now.getUTCMinutes())+pad2(now.getUTCSeconds())+'Z';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Huis Hennops//Kalender//AF','CALSCALE:GREGORIAN'];
  events.filter(e=>!e.isCancelled).forEach(e=>{
    const cat = CATEGORIES[e.category] || CATEGORIES.hennops;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+e.id+'@huishennops');
    lines.push('DTSTAMP:'+stamp);
    let alarmTrigger;
    if(e.isPeriod && e.endDate){
      lines.push('DTSTART;VALUE=DATE:'+toICSDateOnly(e.date));
      lines.push('DTEND;VALUE=DATE:'+toICSDateOnly(addDaysToDateStr(e.endDate,1)));
      alarmTrigger = '-P1D';
    } else if(e.time){
      lines.push('DTSTART:'+toICSDateTime(e.date, e.time));
      const endInfo = computeEndDateTime(e.date, e.time, e.endTime);
      lines.push('DTEND:'+toICSDateTime(endInfo.date, endInfo.time));
      alarmTrigger = '-PT30M';
    } else {
      lines.push('DTSTART;VALUE=DATE:'+toICSDateOnly(e.date));
      lines.push('DTEND;VALUE=DATE:'+toICSDateOnly(addDaysToDateStr(e.date,1)));
      alarmTrigger = '-P1D';
    }
    lines.push('SUMMARY:'+escapeICS(e.title));
    if(e.location) lines.push('LOCATION:'+escapeICS(e.location));
    if(e.notes) lines.push('DESCRIPTION:'+escapeICS(e.notes));
    lines.push('CATEGORIES:'+[cat.label].concat(getPorts(e).map(k=>PORTFOLIOS[k].label)).concat(getAudience(e)?[AUDIENCES[getAudience(e)]]:[]).map(escapeICS).join(','));
    lines.push('BEGIN:VALARM');
    lines.push('ACTION:DISPLAY');
    lines.push('DESCRIPTION:Herinnering');
    lines.push('TRIGGER:'+alarmTrigger);
    lines.push('END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function downloadICS(){
  if(events.filter(e=>!e.isCancelled).length === 0){
    showToast('Nog geen events om af te laai nie');
    return;
  }
  triggerDownload(new Blob([buildICS()], { type:'text/calendar;charset=utf-8' }), 'huis-hennops-kalender.ics');
  showToast('Afgelaai — maak die lêer oop om by Outlook te voeg');
}

function shareWeek(){
  const today = todayStr();
  const end = addDaysToDateStr(today, 6);
  const evs = events.filter(e => {
    if(e.isCancelled) return false;
    const endC = (e.isPeriod && e.endDate) ? e.endDate : e.date;
    return endC >= today && e.date <= end && (activePortfolio === 'all' || getPorts(e).includes(activePortfolio));
  }).sort((a,b)=> sortKey(a).localeCompare(sortKey(b)));
  if(evs.length === 0){ showToast('Niks op die kalender vir die volgende 7 dae nie'); return; }
  const pf = activePortfolio !== 'all' ? ` (${PORTFOLIOS[activePortfolio].label})` : '';
  let text = `*Hierdie week by Hennops*${pf} 📅\n${formatShortDate(today)} – ${formatShortDate(end)}\n`;
  evs.forEach(e=>{
    const p = parseDate(e.date);
    const when = (e.isPeriod && e.endDate)
      ? `${formatShortDate(e.date)}–${formatShortDate(e.endDate)}`
      : `${AF_DAE_KORT[p.wd]} ${p.d} ${AF_MAANDE_KORT[p.m-1]}${e.time ? ' '+e.time : ''}`;
    const em = getPorts(e).map(k=>PORTFOLIOS[k].emoji).join('');

}

function initApp(){
  if(!db){
    firebaseError = firebaseError || 'Firebase kon nie begin nie.';
    loading = false;
    pinLoaded = true;
    liveBadge.innerHTML = `⚠️ Nie verbind nie`;
    render();
    return;
  }

  // As niks binne 10 sekondes terugkom nie (swak sein / vliegtuig-modus), wys 'n vriendelike boodskap.
  setTimeout(()=>{
    if(!connected && loading){ slowConnection = true; loading = false; liveBadge.innerHTML = `⚠️ Geen verbinding`; render(); }
  }, 10000);

  onValue(ref(db,'events'), (snapshot)=>{
    const val = snapshot.val();
    events = val ? Object.values(val) : [];
    loading = false;
    connected = true;
    slowConnection = false;
    firebaseError = null;
    liveBadge.innerHTML = `<span class="dot"></span>Intyds verbind`;
    render();
  }, (err)=>{
    firebaseError = (err && (err.code || err.message)) ? ((err.code ? err.code + ': ' : '') + (err.message || '')) : 'Onbekende fout';
    loading = false;
    liveBadge.innerHTML = `⚠️ Verbindingsfout`;
    render();
  });

  const liveRender = ()=>{ if(!loading) render(); };
  onValue(ref(db,'vers'), (snap)=>{ vers = snap.val() || {}; liveRender(); }, ()=>{});

  pinLoaded = true;
  lsDel('hennops-unlocked');
  attachAuth();
}

  const isCancelled = !!e.isCancelled;
  const isConfirming = confirmingId === e.id;
  const isNew = e.createdAt && (Date.now() - e.createdAt < THREE_DAYS);
  const movedRecently = !!(e.movedFrom && e.movedAt && (Date.now() - e.movedAt < 14*24*60*60*1000));

  const whenPill = isPeriod
    ? `<span class="meta-pill">🗓 ${formatShortDate(e.date)} – ${formatShortDate(e.endDate)}</span>`

  const audience = getAudience(e);
  const rs = rsvp[e.id] || {};

      <div class="event-title" style="${isCancelled?'text-decoration:line-through;':''}">${escapeHtml(e.title)}</div>
      <div class="event-meta">
        ${whenPill}
        ${wxPill(e)}
        ${e.location ? `<span class="meta-pill">📍 ${escapeHtml(e.location)}</span>` : ''}
        ${e.addedBy ? `<span class="meta-pill">👤 ${escapeHtml(e.addedBy)}</span>` : ''}
      </div>
      ${(getPorts(e).length || movedRecently || audience) ? `<div class="event-meta" style="margin-top:6px;">
        ${getPorts(e).map(k=>`<span class="meta-pill port">${PORTFOLIOS[k].emoji} ${PORTFOLIOS[k].label}</span>`).join('')}
        ${audience ? `<span class="meta-pill port">${AUD_EMOJI[audience]} ${AUDIENCES[audience]}</span>` : ''}
        ${movedRecently ? `<span class="meta-pill moved">↪ Verskuif van ${formatShortDate(e.movedFrom)}</span>` : ''}
      </div>` : ''}
      ${e.notes ? `<div class="event-notes">${escapeHtml(e.notes)}</div>` : ''}
      <div class="card-actions">
        <button class="link-btn" data-act="evopen" data-id="${e.id}">Meer ›</button>
        ${canRsvp ? `<button class="link-btn ${iGo?'on':''}" data-act="rsvp" data-id="${e.id}">${iGo?'✋ Ek gaan ✓':'✋ Ek gaan'}${rsCount?` (${rsCount})`:''}</button>` : ''}
        ${unlocked ? `<button class="link-btn" data-share-event="${e.id}">↗ Deel</button>` : ''}
      </div>
      ${unlocked && rsCount ? `<div class="event-notes" style="margin-top:2px">Gaan: ${Object.values(rs).map(x=>escapeHtml(x.name||'(sonder naam)')).join(', ')}</div>` : ''}
      ${unlocked && isConfirming ? `<div class="manage">
        <button class="mini-btn" data-edit-event="${e.id}">Wysig</button>
        <button class="mini-btn" data-copy-event="${e.id}">Kopieer</button>
        ${!isCancelled ? `<button class="mini-btn" data-cancel-event="${e.id}">Kanselleer</button>` : `<button class="mini-btn" data-restore-event="${e.id}">Herstel</button>`}
        <button class="mini-btn danger" data-remove-event="${e.id}">Verwyder heeltemal</button>
        ${e.seriesId ? `<button class="mini-btn danger" data-remove-series="${e.id}">Verwyder hele reeks</button>` : ''}
        <button class="mini-btn" data-close-confirm="1">Los dit</button>
      </div>` : ''}
    </div>
    <div class="event-side">
      ${isCancelled ? `<span class="cat-tag" style="background:#B84A3E">GEKANSELLEER</span>` : `<span class="cat-tag" style="background:${cat.hex}">${cat.label}</span>`}
      ${isNew && !isCancelled ? `<span class="cat-tag" style="background:var(--accent-dark)">NUUT</span>` : ''}
      ${isOngoing && !isCancelled ? `<span class="cat-tag" style="background:var(--sage)">Nou aan die gang</span>` : ''}
      ${unlocked && !isConfirming ? `<button class="menu-btn" data-open-confirm="${e.id}" title="Opsies" aria-label="Opsies">⋯</button>` : ''}
    </div>

function buildListHtml(){
  const today = todayStr();
  const tomorrow = addDaysToDateStr(today, 1);
  const currentYear = parseDate(today).y;

  let filtered = applyFilters(events, false);
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    filtered = filtered.filter(e => (e.title||'').toLowerCase().includes(q) || (e.location||'').toLowerCase().includes(q) || (e.notes||'').toLowerCase().includes(q));
  }
  if(!showPast){
    filtered = filtered.filter(e => ((e.isPeriod && e.endDate) ? e.endDate : e.date) >= today);
  }
  filtered.sort((a,b)=> sortKey(a).localeCompare(sortKey(b)));

  // Tydperke wat reeds begin het (bv. HA-tydperk) kry hul eie "Nou aan die gang"-afdeling bo-aan.
  const ongoing = [];
  const groups = {};
  filtered.forEach(e=>{
    if(e.isPeriod && e.endDate && e.date < today && e.endDate >= today){ ongoing.push(e); }
    else { (groups[e.date] = groups[e.date] || []).push(e); }
  });

  const dateKeys = Object.keys(groups).sort();
  if(ongoing.length === 0 && dateKeys.length === 0){
    return `<div class="empty-state"><div class="big">📅</div><p>${searchQuery.trim() ? 'Niks gevind vir jou soektog nie.' : 'Niks op die kalender nie.'}</p>${(!searchQuery.trim() && !showPast) ? '<p>Nuwe events verskyn hier sodra HK dit byvoeg.</p>' : ''}</div>`;
  }

  let html = '';
  if(ongoing.length){
    html += `<div class="section-label">Nou aan die gang</div>`;
    ongoing.forEach(e=>{ html += cardHtml(e, today); });
  }

  let lastMonth = '';
  let anchorSet = false;
  dateKeys.forEach(dateKey=>{
    const p = parseDate(dateKey);
    const monthKey = p.y + '-' + p.m;
    if(monthKey !== lastMonth){
      lastMonth = monthKey;
      html += `<div class="month-label">${AF_MAANDE[p.m-1]}${p.y !== currentYear ? ' ' + p.y : ''}</div>`;
    }
    const isToday = dateKey === today;
    const wdLabel = isToday ? 'Vandag' : (dateKey === tomorrow ? 'Môre' : AF_DAE_KORT[p.wd]);
    const idAttr = (!anchorSet && dateKey >= today) ? 'id="todayAnchor"' : '';
    if(idAttr) anchorSet = true;
    html += `<div class="day-row ${isToday?'today':''} ${dateKey<today?'pastday':''}" ${idAttr}>
      <div class="day-col"><div class="day-num">${p.d}</div><div class="day-wd">${wdLabel}</div></div>
      <div class="day-cards">${groups[dateKey].map(e=>cardHtml(e, today)).join('')}</div>
    </div>`;
  });
  return html;
}

  });
  root.querySelectorAll('[data-share-event]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const ev = events.find(e=>e.id === b.dataset.shareEvent);
      if(ev) shareOnWhatsApp(ev);
    });
  });
  root.querySelectorAll('[data-open-confirm]').forEach(b=>{
    b.addEventListener('click', ()=>{ confirmingId = b.dataset.openConfirm; render(); });
  });
  root.querySelectorAll('[data-close-confirm]').forEach(b=>{
    b.addEventListener('click', ()=>{ confirmingId = null; render(); });
  });

  root.querySelectorAll('[data-copy-event]').forEach(b=>{

  root.querySelectorAll('[data-restore-event]').forEach(b=>{
    b.addEventListener('click', ()=> restoreEvent(b.dataset.restoreEvent));
  });
  root.querySelectorAll('[data-remove-event]').forEach(b=>{
    b.addEventListener('click', ()=> deleteEvent(b.dataset.removeEvent));
  });
}

function applyFilters(list, ignoreWeek){
  const today = todayStr();
  return list.filter(e=>{
    if(activeFilter === 'week' && !ignoreWeek){
      const endC = (e.isPeriod && e.endDate) ? e.endDate : e.date;
      if(!(endC >= today && e.date <= addDaysToDateStr(today, 7))) return false;
    } else if(activeFilter !== 'alle' && activeFilter !== 'week' && e.category !== activeFilter){
      return false;
    }
    if(activePortfolio !== 'all' && !getPorts(e).includes(activePortfolio)) return false;
    if(activeAudience !== 'all' && getAudience(e) !== activeAudience) return false;
    return true;
  });
}

function parseBulkLine(line){
  const parts = line.split('|').map(p=>p.trim());
  if(parts.length < 3) return { error: 'Te min velde (datum | kategorie | titel)' };
  const [datePart, catPart, titlePart, locPart, notesPart, portPart] = parts;

  let dateStr, endDateStr = null, isPeriod = false;
  if(datePart.includes(' tot ')){
    const [d1, d2] = datePart.split(' tot ').map(s=>s.trim());
    dateStr = d1; endDateStr = d2; isPeriod = true;
  } else {
    dateStr = datePart.trim();
  }
  const dateRe = /^\d{4}-\d{2}-\d{2}$/;
  if(!dateRe.test(dateStr)) return { error: `Ongeldige datum "${dateStr}" (gebruik JJJJ-MM-DD)` };
  if(isPeriod && !dateRe.test(endDateStr)) return { error: `Ongeldige einddatum "${endDateStr}"` };

  const catKey = Object.keys(CATEGORIES).find(k => CATEGORIES[k].label.toLowerCase() === catPart.toLowerCase());
  if(!catKey) return { error: `Onbekende kategorie "${catPart}" (gebruik Akademies / Huis Hennops / Mede Koshuise / Akademia)` };
  if(!titlePart) return { error: 'Geen titel nie' };
  const portfolios = [];
  let audience = '';
  if(portPart){
    for(const name of portPart.split(',').map(x=>x.trim()).filter(Boolean)){
      const n = name.toLowerCase();
      if(n === 'eerstejaars' || n === 'seniors'){ audience = n; continue; }
      if(n === 'kuns en kultuur'){ portfolios.push('kultuur'); continue; }
      const pk = Object.keys(PORTFOLIOS).find(k => PORTFOLIOS[k].label.toLowerCase() === n);
      if(!pk) return { error: `Onbekende portefeulje "${name}" (${Object.values(PORTFOLIOS).map(p=>p.label).join(', ')}, of Eerstejaars/Seniors)` };
      portfolios.push(pk);
    }
  }

  return {
    event: {
      title: titlePart, date: dateStr, isPeriod, endDate: isPeriod ? endDateStr : '',
      time: '', category: catKey, portfolios, audience, location: locPart || '', addedBy: 'Bulk-invoer',
      notes: notesPart || '', isCancelled: false, createdAt: Date.now()
    }
  };
}

function openBulkAddModal(){
  modalBody.innerHTML = `
    <h3>Voeg 'n lys datums by</h3>
    <p class="hint" style="margin:-6px 0 12px; font-size:13px;">Een event per reël. Formaat: <b>datum | kategorie | titel | plek | notas | portefeuljes</b> (plek, notas en portefeuljes is opsioneel; portefeuljes met komma, bv. <i>Sport, Sosiaal</i>; <i>Eerstejaars</i> of <i>Seniors</i> mag ook). Vir 'n tydperk: <b>2026-09-15 tot 2026-09-19 | Akademies | HA-tydperk 3</b></p>
    <div class="field">
      <textarea id="bulk-text" style="min-height:170px; font-family:monospace; font-size:14px;" placeholder="2026-09-15 tot 2026-09-19 | Akademies | HA-tydperk 3
2026-10-01 | Akademia | Direkteursdinee | Sentrum"></textarea>
    </div>
    <div id="bulkErrors" class="error-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="bulkCancel">Kanselleer</button>

  `;
  openModal();
  document.getElementById('bulkCancel').addEventListener('click', closeModal);
  document.getElementById('bulkSave').addEventListener('click', async ()=>{
    const raw = document.getElementById('bulk-text').value;

    const errEl = document.getElementById('bulkErrors');
    if(lines.length === 0){ errEl.textContent = 'Plak eers ten minste een reël.'; return; }

    const goodEvents = [];
    const errors = [];
    lines.forEach((line, i)=>{
      const result = parseBulkLine(line);
      if(result.error) errors.push(`Reël ${i+1}: ${result.error}`);
      else goodEvents.push(result.event);
    });
    if(goodEvents.length === 0){ errEl.innerHTML = errors.map(escapeHtml).join('<br>'); return; }

    const updates = {};
    goodEvents.forEach((ev, i)=>{
      const id = 'ev_' + Date.now() + '_' + i;
      ev.id = id;
      updates['events/'+id] = ev;
    });
    try{
      await update(ref(db), updates);
      closeModal();
      showToast(`${goodEvents.length} event(s) bygevoeg${errors.length ? `, ${errors.length} oorgeslaan` : ''}`);
    }catch(e){
      errEl.textContent = 'Kon nie stoor nie: ' + e.message;
    }
  });
}

function makeOccurrences(base, rep, until){
  const out = [];
  const p = parseDate(base.date);
  const span = (base.isPeriod && base.endDate) ? daysBetween(base.date, base.endDate) : 0;
  const seriesId = 'ser_' + Date.now();
  const stamp = Date.now();
  for(let i=0; i<60; i++){
    let d;
    if(rep === 'm1'){
      const dim = new Date(p.y, p.m - 1 + i + 1, 0).getDate();
      const dt = new Date(p.y, p.m - 1 + i, Math.min(p.d, dim));
      d = dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());
    } else {
      d = addDaysToDateStr(base.date, i * (rep === 'w2' ? 14 : 7));
    }
    if(d > until) break;
    out.push(Object.assign({}, base, {
      id: 'ev_' + stamp + '_' + i,
      date: d,
      endDate: span ? addDaysToDateStr(d, span) : '',
      seriesId
    }));
  }
  return out;
}

}

function monthHtml(){

  const dim = new Date(mCur.y, mCur.m, 0).getDate();

  let cells = '';

  const sp = parseDate(selDay);

    <div id="dayList">${bdOn(selDay).map(b=>`<div class="bd-row">🎂 ${bdLabel(b)} verjaar</div>`).join('')}${dayEvs.length ? dayEvs.map(e=>cardHtml(e, today)).join('') : `${bdOn(selDay).length ? '' : '<div class="empty-state" style="padding:22px 10px"><p>Niks op hierdie dag nie.</p></div>'}`}</div>`;

// ---------- WEEK-PLAKKAAT ----------
function weekMonday(){
  const t = todayStr();
  return addDaysToDateStr(t, -((parseDate(t).wd + 6) % 7) + 7 * weekOffset);
}
function weekData(){
  const mon = weekMonday();
  const list = applyFilters(events, true).filter(e=>!e.isCancelled);
  const days = [];
  for(let i=0;i<7;i++){
    const d = addDaysToDateStr(mon, i);
    days.push({ d, bd: bdOn(d), evs: eventsOn(d, list).filter(e=>!(e.isPeriod && e.endDate)).sort((a,b)=> sortKey(a).localeCompare(sortKey(b))) });
  }
  const sun = addDaysToDateStr(mon,6);
  const periods = list.filter(e=>e.isPeriod && e.endDate && e.date <= sun && e.endDate >= mon).sort((a,b)=>a.date.localeCompare(b.date));
  return { mon, sun, days, periods };
}
function weekTitle(){
  return weekOffset === 0 ? 'Hierdie week' : weekOffset === 1 ? 'Volgende week' : weekOffset === -1 ? 'Verlede week' : 'Week';
}
function weekHtml(){
  const today = todayStr();
  const w = weekData();
  const bands = w.days.map((day,i)=>{
    const p = parseDate(day.d);
    const bdLine = day.bd.length ? `<div>🎂 ${day.bd.map(b=>escapeHtml(b.name)).join(', ')}</div>` : '';
    const evs = (day.evs.length || day.bd.length) ? bdLine + day.evs.map(e=>{
      const t = e.time || '';
      const em = emojiOf(e);
      return `<div>${t ? `<span class="t">${escapeHtml(t)}</span>` : ''}${escapeHtml(e.title)}${em ? ' '+em : ''}</div>`;
    }).join('') : `<div>Niks</div>`;
    return `<div class="wband ${(day.evs.length||day.bd.length) ? (i%2?'b2':'b1') : 'bz'} ${day.d===today?'today':''}"><div class="dc"><div class="dn">${p.d}</div><div class="dw">${AF_DAE_KORT[p.wd].toUpperCase()}</div></div><div class="evs">${evs}</div></div>`;
  }).join('');
  return `<div class="wk-top"><div><h2>${weekTitle()}</h2><div class="wk-sub">${formatShortDate(w.mon)} – ${formatShortDate(w.sun)}</div></div></div>
    <div class="mv-nav" style="margin:0 0 10px;justify-content:space-between"><button data-act="wnav" data-d="-1" aria-label="Vorige week">‹</button><button data-act="wtoday" style="flex:1">Vandag</button><button data-act="wnav" data-d="1" aria-label="Volgende week">›</button></div>
    ${w.periods.length ? `<div class="wk-strips">${w.periods.map(e=>`<div class="wk-strip">📅 ${escapeHtml(e.title)} <span>${formatShortDate(e.date)} – ${formatShortDate(e.endDate)}</span></div>`).join('')}</div>` : ''}
    ${bands}
    ${unlocked ? `<div class="row-acts"><button class="ics-btn" data-act="weekimg" style="background:var(--accent);border-color:var(--accent);color:#fff">🖼 HK: deel as prent</button></div>` : ''}`;
}
function canvasFit(ctx, text, maxW){
  if(ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while(t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0,-1);
  return t.trimEnd() + '…';
}
async function makeWeekPoster(){
  const w = weekData();
  try{ if(document.fonts && document.fonts.load){ await document.fonts.load('900 60px Archivo'); await document.fonts.load('700 30px Archivo'); } }catch(e){}
  const W = 1080, H = 1350;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const FF = "Archivo, 'Work Sans', Arial, sans-serif";
  x.fillStyle = '#CBC3BA'; x.fillRect(0,0,W,H);
  const logo = document.querySelector('.brand img');
  if(logo && logo.complete && logo.naturalWidth) x.drawImage(logo, 56, 46, 123, 102);
  x.fillStyle = '#33291F'; x.textBaseline = 'alphabetic';
  x.font = `900 82px ${FF}`; x.fillText(weekTitle().toUpperCase(), 206, 108);
  x.font = `600 34px ${FF}`; x.fillStyle = '#6E6459';
  x.fillText(`${formatShortDate(w.mon)} – ${formatShortDate(w.sun)}  ·  Huis Hennops`, 208, 152);
  const per = w.periods.slice(0,3);
  per.forEach((e,i)=>{
    const y = 176 + i*50;
    x.fillStyle = 'rgba(168,110,83,0.28)'; x.beginPath(); x.roundRect ? x.roundRect(40, y, W-80, 40, 20) : x.rect(40, y, W-80, 40); x.fill();
    x.fillStyle = '#33291F'; x.font = `700 24px ${FF}`; x.textAlign = 'left';
    x.fillText(canvasFit(x, `${e.title}   ${formatShortDate(e.date)} – ${formatShortDate(e.endDate)}`, W-130), 64, y + 28);
  });
  const top = 190 + per.length*50, bandH = Math.floor((H - 131 - top) / 7), gap = 0;
  w.days.forEach((day,i)=>{
    const y = top + i*bandH;
    const has = day.evs.length > 0 || day.bd.length > 0;
    x.fillStyle = has ? (i%2 ? '#8A5640' : '#A86E53') : '#B7ACA0';
    x.fillRect(0, y, W, bandH - gap);
    const fg = has ? '#F6F3EE' : '#4A4036';
    x.fillStyle = fg;
    const p = parseDate(day.d);
    const k = bandH / 147;
    x.font = `900 ${Math.round(104*k)}px ${FF}`; x.textAlign = 'center';
    x.fillText(String(p.d), 100, y + Math.round(104*k));
    x.font = `700 ${Math.round(24*k)}px ${FF}`; x.fillText(AF_DAE_KORT[p.wd].toUpperCase(), 100, y + Math.round(134*k));
    x.textAlign = 'left';
    const lines = [];
    if(!has) lines.push('Niks');
    else { if(day.bd.length) lines.push('🎂 ' + day.bd.map(b=>b.name).join(', ')); day.evs.forEach(e=>{
      const t = e.time || '';
      const em = emojiOf(e);
      lines.push((t ? t + '   ' : '') + e.title + (em ? '  ' + em : ''));
    }); }
    const shown = lines.length > 3 ? lines.slice(0,2).concat([`+ ${lines.length-2} meer`]) : lines;
    x.font = `700 32px ${FF}`;
    const lh = Math.min(40, Math.floor((bandH - 20) / Math.max(1, shown.length)));
    const y0 = y + (bandH - lh*shown.length)/2 + lh*0.72;
    shown.forEach((ln,j)=>{ x.fillText(canvasFit(x, ln, W - 210 - 50), 200, y0 + j*lh); });
  });
  x.fillStyle = '#33291F'; x.fillRect(0, H-131, W, 131);
  x.fillStyle = '#F6F3EE'; x.font = `800 34px ${FF}`; x.fillText('Huis Hennops kalender', 56, H-72);
  x.font = `500 26px ${FF}`; x.fillStyle = '#CBC3BA';
  x.fillText(canvasFit(x, location.href.split('#')[0].split('?')[0].replace(/^https?:\/\//,''), W-112), 56, H-30);
  return await new Promise(res => c.toBlob(res, 'image/png'));
}
async function shareWeekImage(){
  const w = weekData();
  if(!w.days.some(d=>d.evs.length) && !w.periods.length){ showToast('Niks op hierdie week se kalender nie'); return; }
  showToast('Maak die prent reg...');
  let blob;
  try{ blob = await makeWeekPoster(); }catch(e){ showToast('Kon nie die prent maak nie'); return; }
  if(!blob){ showToast('Kon nie die prent maak nie'); return; }
  const file = new File([blob], 'hennops-week.png', { type:'image/png' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:'Hierdie week by Hennops' }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  triggerDownload(blob, 'hennops-week.png');
  showToast('Prent afgelaai. Stuur dit in die groep.');
}

let verjaar = {};
const AF_MON_NAMES = ['januarie','februarie','maart','april','mei','junie','julie','augustus','september','oktober','november','desember'];
const isLeap = (y)=> (y%4===0 && y%100!==0) || y%400===0;
function bdList(){ return Object.values(verjaar || {}).filter(b=>b && b.name && b.m && b.d); }
function bdLabel(b){ return escapeHtml(b.name) + (b.type === 'alumnus' ? ` <span style="color:var(--ink-soft);font-weight:500">(alumnus${b.yr ? " '"+String(b.yr).slice(-2) : ''})</span>` : ''); }
function bdPlain(b){ return b.name + (b.type === 'alumnus' ? ` (alumnus${b.yr ? " '"+String(b.yr).slice(-2) : ''})` : ''); }
function bdOn(dateStr){
  const p = parseDate(dateStr);
  return bdList().filter(b => (b.m === p.m && b.d === p.d) || (b.m === 2 && b.d === 29 && p.m === 2 && p.d === 28 && !isLeap(p.y)));
}
function bdSoon(n){
  const out = [];
  const t = todayStr();
  for(let i=1;i<=n;i++){ const d = addDaysToDateStr(t, i); bdOn(d).forEach(b=>out.push({ b, d })); }
  return out;
}
function bdCardHtml(){
  const today = bdOn(todayStr());
  const soon = bdSoon(7);
  if(!today.length && !soon.length) return '';
  const head = today.length ? `<div class="big">🎂 Vandag verjaar ${today.map(bdLabel).join(', ')}!</div>` : `<div class="big">🎂 Verjaarsdae</div>`;
  const sl = soon.length ? `<div class="soon">Binnekort: ${soon.slice(0,5).map(x=>`${bdLabel(x.b)} (${formatShortDate(x.d)})`).join(' · ')}${soon.length>5?` · +${soon.length-5} meer`:''}</div>` : '';
  const sh = (unlocked && (today.length || soon.length)) ? `<button class="share" data-act="bdshare">↗ HK: deel op WhatsApp</button>` : '';
  return `<div class="bday">${head}${sl}${sh}</div>`;
}
function bdShare(){
  const today = bdOn(todayStr());
  const soon = bdSoon(7);
  let t = '';
  if(today.length) t += `🎂 *Vandag verjaar:*\n${today.map(b=>'• '+bdPlain(b)).join('\n')}\n\nGelukwensing, manne! 🎉`;
  if(soon.length) t += `${t?'\n\n':''}*Binnekort:*\n${soon.map(x=>`• ${bdPlain(x.b)}, ${formatShortDate(x.d)}`).join('\n')}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}
function parseBdDate(txt){
  txt = (txt||'').trim().toLowerCase();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(txt); if(m) return { m:+m[2], d:+m[3] };
  m = /^(\d{1,2})[\s\/\-\.]+([a-zë]+|\d{1,2})/.exec(txt);
  if(!m) return null;
  let d = +m[1], mon = m[2];
  let mi = /^\d+$/.test(mon) ? +mon : AF_MON_NAMES.findIndex(x=>x === mon || x.startsWith(mon) && mon.length>=3) + 1;
  if(!(mi>=1 && mi<=12) || d<1 || d>31) return null;
  return { m:mi, d };
}

async function bdBulk(){

  lines.forEach((ln,i)=>{

    upd['verjaar/'+id] = { id, name: parts[0], d: dt.d, m: dt.m, type: /alum/i.test(parts[2]||'') ? 'alumnus' : 'lid', yr: parts[3] && /^\d{4}$/.test(parts[3]) ? +parts[3] : '' };
  });

  if(!Object.keys(upd).length){ err.textContent = 'Plak eers \'n lys.'; return; }

function toMin(t){ if(!t) return null; const [h,m] = t.split(':').map(Number); return h*60+(m||0); }
function conflictText(data){
  const out = [];
  const a0 = toMin(data.time), a1 = a0 == null ? null : (toMin(data.endTime) ?? a0 + 60);
  const lo = (data.location||'').trim().toLowerCase();
  const dEnd = data.isPeriod && data.endDate ? data.endDate : data.date;
  events.forEach(e=>{
    if(e.id === data.id || e.isCancelled) return;
    const eEnd = e.isPeriod && e.endDate ? e.endDate : e.date;
    if(e.date > dEnd || eEnd < data.date) return;
    if(e.isPeriod && e.endDate && e.category === 'akademies' && data.category !== 'akademies'){ out.push(`Hierdie datum val binne "${e.title}" (${formatShortDate(e.date)} – ${formatShortDate(e.endDate)}).`); return; }
    const el = (e.location||'').trim().toLowerCase();
    if(!lo || !el || lo !== el || data.isPeriod || e.isPeriod) return;
    const b0 = toMin(e.time), b1 = b0 == null ? null : (toMin(e.endTime) ?? b0 + 60);
    const overlap = (a0 == null || b0 == null) ? true : (a0 < b1 && b0 < a1);
    if(overlap) out.push(`"${e.title}" gebruik ook ${e.location} op ${formatShortDate(e.date)}${e.time ? ' om '+e.time : ''}.`);
  });
  return out;
}

(function readInvite(){
  const m = /[#&]kode=([\w-]+)/.exec(location.hash || '');
  if(m){ lsSet('hennops-kode', m[1]); invitePending = true; }
})();

function recalcRoles(){
  const r = myRole || {};
  isStelsel = !!r.stelsel; isPrim = !!(r.prim || r.stelsel);
  const was = unlocked;
  unlocked = !!(r.hk || r.prim || r.stelsel);
  if(was !== unlocked) confirmingId = null;
}
function fullName(p){ return p ? `${p.naam||''} ${p.van||''}`.trim() : ''; }
function myName(){ return myProfile ? fullName(myProfile) : (me && me.email ? me.email.split('@')[0] : ''); }
function stopListeners(list){ list.forEach(f=>{ try{ if(typeof f === 'function') f(); }catch(e){} }); list.length = 0; }
function waitRoles(){
  return new Promise(res=>{ let n = 0; const t = setInterval(()=>{ if(roleLoaded || ++n > 30){ clearInterval(t); res(); } }, 100); });
}

function attachAuth(){
  if(!auth) return;
  onAuthStateChanged(auth, (user)=>{
    stopListeners(_memberUnsubs); stopListeners(_authUnsubs);
    me = user || null; myRole = {}; myProfile = null; profLoaded = false; roleLoaded = false;
    rsvp = {}; bord = {}; verjaar = {}; mvdw = null; myOpk = {};
    recalcRoles();
    const first = !authReady; authReady = true;
    if(!me){
      closeOnb();
      if(!loading) render();
      tryOpk();
      if(first && invitePending){ invitePending = false; setTimeout(()=>openAuthModal('up'), 400); }
      return;
    }
    const uid = me.uid;
    _authUnsubs.push(onValue(ref(db,'roles/'+uid), s=>{ myRole = s.val() || {}; roleLoaded = true; recalcRoles(); if(!loading) render(); }, ()=>{ roleLoaded = true; }));
    _authUnsubs.push(onValue(ref(db,'profiles/'+uid), s=>{ myProfile = s.val(); profLoaded = true; routeOnb(); tryOpk(); maybeBdPopup(); if(!loading) render(); }, ()=>{ profLoaded = true; routeOnb(); }));
    const live = ()=>{ if(!loading) render(); };
    _memberUnsubs.push(onValue(ref(db,'bord'), s=>{ bord = s.val() || {}; live(); }, ()=>{}));
    _memberUnsubs.push(onValue(ref(db,'rsvp'), s=>{ rsvp = s.val() || {}; live(); }, ()=>{}));
    _memberUnsubs.push(onValue(ref(db,'verjaar'), s=>{ verjaar = s.val() || {}; live(); maybeBdPopup(); }, ()=>{}));
    _memberUnsubs.push(onValue(ref(db,'mvdw'), s=>{ mvdw = s.val() || null; live(); }, ()=>{}));
    invitePending = false;
    if(!loading) render();
  });
}
function routeOnb(){
  if(!me || !profLoaded) return;
  if(!myProfile){ if(!W) openOnb(false); }
  else if(W && !W.edit){ closeOnb(); showToast('Welkom by Hennops, ' + (myProfile.naam || '') + '!'); maybeBdPopup(); }
}

// ---------- INTEKEN ----------
function authErrorText(e){
  const c = (e && e.code) || '';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return 'Verkeerde e-pos of wagwoord.';
  if(c.includes('invalid-email')) return 'Daardie e-posadres lyk nie reg nie.';
  if(c.includes('email-already-in-use')) return 'Hierdie e-pos het reeds \'n rekening. Teken eerder in.';
  if(c.includes('weak-password')) return 'Kies \'n wagwoord van minstens 6 karakters.';
  if(c.includes('too-many-requests')) return 'Te veel pogings. Wag \'n paar minute en probeer weer.';
  if(c.includes('network')) return 'Geen internet nie. Probeer weer.';
  if(c.includes('operation-not-allowed')) return 'E-pos-inteken is nog nie in Firebase aangeskakel nie.';
  if(c.includes('requires-recent-login')) return 'Teken uit, teken weer in, en probeer dan weer.';
  return 'Iets het skeefgeloop' + (e && e.message ? ': ' + e.message : '.');
}
function openAuthModal(mode, after){
  if(!auth){ showToast('Inteken is nie beskikbaar nie. Maak die blad toe en oop.'); return; }
  const up = mode === 'up';
  modalBody.innerHTML = `
    <h3>${up ? 'Skep jou profiel' : 'Teken in'}</h3>
    <p class="hint" style="margin:-8px 0 14px; font-size:13.5px;">${up ? 'Jy doen dit net een keer. Daarna bly jy ingeteken op hierdie foon.' : 'Teken in met jou e-pos en wagwoord.'}</p>
    <div class="field"><label for="authEmail">E-pos</label><input type="email" id="authEmail" inputmode="email" autocomplete="username" autocapitalize="none" value="${escapeHtml(lsGet('hennops-email')||'')}"></div>
    <div class="field"><label for="authPass">Wagwoord${up ? ' (minstens 6 karakters)' : ''}</label><input type="password" id="authPass" autocomplete="${up ? 'new-password' : 'current-password'}"></div>
    ${up ? `<div class="field"><label for="authKode">Huiskode</label><input type="text" id="authKode" autocapitalize="characters" autocomplete="off" value="${escapeHtml(lsGet('hennops-kode')||'')}"><p class="hint">Die HK het dit in die groep gestuur.</p></div>` : ''}
    <div id="modalPinError" class="error-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="pinCancel">Kanselleer</button>
      <button class="btn btn-primary" id="pinConfirm">${up ? 'Skep rekening' : 'Teken in'}</button>
    </div>
    <div style="margin-top:14px;display:flex;flex-direction:column;gap:2px;">
      <button class="link-btn" id="authSwitch">${up ? 'Het reeds \'n rekening? Teken in' : 'Nog nie \'n rekening nie? Skep \'n profiel'}</button>
      ${up ? '' : '<button class="link-btn" id="authForgot">Wagwoord vergeet?</button>'}
    </div>`;
  openModal();
  document.getElementById('pinCancel').addEventListener('click', closeModal);
  document.getElementById('authSwitch').addEventListener('click', ()=> openAuthModal(up ? 'in' : 'up', after));
  const fg = document.getElementById('authForgot');
  if(fg) fg.addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const errEl = document.getElementById('modalPinError');
    if(!email){ errEl.textContent = 'Tik eers jou e-pos hierbo in.'; return; }
    try{ await sendPasswordResetEmail(auth, email); errEl.style.color = 'var(--sage)'; errEl.textContent = 'Ons het \'n skakel gestuur. Kyk in jou e-pos (ook die gemors-vouer).'; }
    catch(e){ errEl.style.color = ''; errEl.textContent = authErrorText(e); }
  });
  const go = async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPass').value;
    const errEl = document.getElementById('modalPinError');
    const btn = document.getElementById('pinConfirm');
    errEl.style.color = '';
    if(!email || !pass){ errEl.textContent = 'Vul albei in.'; return; }
    const kode = up ? document.getElementById('authKode').value.trim() : '';
    if(up && !kode){ errEl.textContent = 'Tik die huiskode in.'; return; }
    btn.disabled = true; btn.textContent = up ? 'Skep...' : 'Teken in...'; errEl.textContent = '';
    try{
      if(up){
        lsSet('hennops-kode', kode);
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        try{ await set(ref(db,'kodetoets/'+cred.user.uid), { kode }); }catch(e2){ /* die wizard vra weer as dit nie gewerk het nie */ }
      } else {
        await signInWithEmailAndPassword(auth, email, pass);
      }
      lsSet('hennops-email', email);
      closeModal();
      if(after) after();
    }catch(e){
      errEl.textContent = authErrorText(e);
      btn.disabled = false; btn.textContent = up ? 'Skep rekening' : 'Teken in';
    }
  };
  document.getElementById('pinConfirm').addEventListener('click', go);
  document.getElementById('authPass').addEventListener('keydown', (ev)=>{ if(ev.key === 'Enter') go(); });
  setTimeout(()=>{ const em = document.getElementById('authEmail'); if(!em) return; const i = em.value ? document.getElementById('authPass') : em; if(i) i.focus(); }, 60);
}
function openPinModalThen(cb){
  if(me && unlocked){ cb(); return; }
  if(me && roleLoaded && !unlocked){ showToast('Net die HK kan dit doen.'); return; }
  openAuthModal('in', async ()=>{ await waitRoles(); if(unlocked) cb(); else showToast('Jy is ingeteken, maar jy is nie HK nie.'); });
}

// ---------- PROFIEL-WIZARD ----------
function closeOnb(){ if(!onbEl) return; onbEl.hidden = true; onbEl.innerHTML = ''; document.body.style.overflow = ''; W = null; }
const JARE = ['1e jaar','2e jaar','3e jaar','4e jaar','Honneurs','Meesters of hoër'];
const VERW = ['Ma','Pa','Voog','Broer of suster','Ouma of oupa','Ander'];
async function openOnb(edit){
  if(!me) return;
  W = { edit: !!edit, step: 1, d: {}, n: { k1:{}, k2:{} }, m: {}, showK2: false, err: '', busy: false };
  if(edit && myProfile){
    const p = myProfile;
    W.d = { naam:p.naam||'', van:p.van||'', tel:p.tel||'', studie:p.studie||'', jaar:p.jaar||JARE[0], vd:p.vd||'', vm:p.vm||'', wys:p.wys!==false, kamer:p.kamer||'' };
    try{ const s = await get(ref(db,'nood/'+me.uid)); const v = s.val() || {}; W.n.k1 = v.k1 || {}; W.n.k2 = v.k2 || {}; W.showK2 = !!(v.k2 && v.k2.naam); }catch(e){}
    try{ const s = await get(ref(db,'medies/'+me.uid)); W.m = s.val() || {}; }catch(e){}
  } else {
    W.d = { jaar: JARE[0], wys: true };
    let ok = false;
    try{ const s = await get(ref(db,'kodetoets/'+me.uid)); ok = s.exists(); }catch(e){}
    W.step = ok ? 1 : 0;
  }
  onbEl.hidden = false; document.body.style.overflow = 'hidden';
  renderOnb();
}
function fld(id, label, val, attrs){ return `<div class="field"><label for="${id}">${label}</label><input id="${id}" value="${escapeHtml(val||'')}" ${attrs||''}></div>`; }

  if(st === 0){
    title = 'Welkom'; sub = 'Tik die huiskode wat die HK in die groep gestuur het.';
    body = `<div class="card">${fld('o-kode','Huiskode', lsGet('hennops-kode')||'', 'autocapitalize="characters" autocomplete="off"')}</div>`;

    title = 'Wie is jy?'; sub = 'Net die basiese goed.';
    body = `<div class="card">
      <div class="row2">${fld('o-naam','Voornaam',d.naam,'autocomplete="given-name"')}${fld('o-van','Van',d.van,'autocomplete="family-name"')}</div>

      <div class="field"><label for="o-jaar">Studiejaar</label><select id="o-jaar">${JARE.map(j=>`<option ${d.jaar===j?'selected':''}>${j}</option>`).join('')}</select></div>
      <div class="row2"><div class="field"><label for="o-vd">Verjaarsdag (dag)</label><input id="o-vd" type="number" min="1" max="31" inputmode="numeric" value="${d.vd||''}" placeholder="14"></div>
      <div class="field" style="flex:1.6"><label for="o-vm">Maand</label><select id="o-vm"><option value="">–</option>${AF_MAANDE.map((n,i)=>`<option value="${i+1}" ${+d.vm===i+1?'selected':''}>${n}</option>`).join('')}</select></div></div>
      <label class="port-opt" style="padding:4px 0"><input type="checkbox" id="o-wys" ${d.wys!==false?'checked':''}> Wys my verjaarsdag vir die huis</label>
    </div>`;
  } else if(st === 2){
    title = 'In \'n noodgeval'; sub = 'Dit is die belangrikste deel. Net 1 kontak is verpligtend.';
    body = `<div class="card"><b>Nood-kontak</b>
      ${fld('o-k1n','Naam',k1.naam,'autocomplete="off"')}
      <div class="field"><label for="o-k1v">Verwantskap</label><select id="o-k1v">${VERW.map(v=>`<option ${k1.verw===v?'selected':''}>${v}</option>`).join('')}</select></div>
      ${fld('o-k1t','Selfoon',k1.tel,'type="tel" inputmode="tel" placeholder="082 123 4567"')}
      ${W.showK2 ? `<hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><b>Tweede kontak</b>
        ${fld('o-k2n','Naam',k2.naam,'')}
        <div class="field"><label for="o-k2v">Verwantskap</label><select id="o-k2v">${VERW.map(v=>`<option ${k2.verw===v?'selected':''}>${v}</option>`).join('')}</select></div>
        ${fld('o-k2t','Selfoon',k2.tel,'type="tel" inputmode="tel"')}` : `<button class="link-btn" data-onb="k2">+ Nog 'n kontak</button>`}
    </div>
    <div class="card"><b>Mediese inligting</b> <span class="hint">(opsioneel, maar help baie)</span>
      <div class="field"><label for="o-m1">Allergieë</label><input id="o-m1" value="${escapeHtml(m.allergie||'')}" placeholder="bv. pynappel, penisillien"></div>
      <div class="field"><label for="o-m2">Mediese toestande</label><input id="o-m2" value="${escapeHtml(m.toestande||'')}" placeholder="bv. asma, diabetes"></div>
      <div class="field"><label for="o-m3">Medikasie</label><input id="o-m3" value="${escapeHtml(m.medikasie||'')}"></div>
      <div class="field"><label for="o-m4">Dokter (naam en nommer)</label><input id="o-m4" value="${escapeHtml(m.dokter||'')}"></div>

      <p class="hint">Net jy, die Prim en die stelsel sien dit altyd. Ander HK-lede kan dit net in 'n noodgeval oopmaak, en die Prim sien wie dit gedoen het.</p>
    </div>
    <label class="port-opt" style="padding:10px 2px;white-space:normal;align-items:flex-start"><input type="checkbox" id="o-ok" ${W.consent?'checked':''} style="margin-top:2px"> <span>Ek verstaan en stem in dat Huis Hennops my nood- en mediese inligting stoor om my in 'n noodgeval te help. <button class="link-btn" data-onb="privaat" style="min-height:0;padding:0;display:inline">Lees hoe ons dit gebruik</button></span></label>`;

    title = 'Jou kamer'; sub = W.edit ? '' : 'Amper klaar.';
    body = `<div class="card">${fld('o-kamer','Kamernommer (as jy weet)',d.kamer,'inputmode="numeric" placeholder="bv. 24"')}

  }
  const last = st === 3;
  onbEl.innerHTML = `<div class="onb-in">
    ${st > 0 ? `<div class="onb-prog"><i style="width:${Math.round(st/3*100)}%"></i></div><div class="hint">Stap ${st} van 3${W.edit ? ' · wysig profiel' : ''}</div>` : ''}
    <h2>${title}</h2>${sub ? `<p class="onb-sub">${sub}</p>` : ''}
    ${body}
    <div id="onbErr" class="error-msg">${escapeHtml(W.err||'')}</div>
    <div class="onb-actions">
      ${(st > 1 || (W.edit && st === 1)) ? `<button class="btn btn-secondary" data-onb="back">${W.edit && st===1 ? 'Kanselleer' : 'Terug'}</button>` : ''}
      <button class="btn btn-primary" data-onb="next" ${W.busy?'disabled':''} style="flex:1">${st===0 ? 'Gaan voort' : last ? (W.edit ? 'Stoor' : 'Maak my profiel klaar') : 'Volgende'}</button>
